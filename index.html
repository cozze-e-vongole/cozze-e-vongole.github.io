<style>
:root{
  --rosa:#F7E3E5; --magenta:#DE0048; --giallo:#FFED00; --blu:#003E88; --nero:#121112;
  --carta:#fff; --testo:#121112; --tenue:#6C6062; --bordo:#E4CDD0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --rosa:#1C1C1F; --carta:#26262A; --testo:#F3EDEE; --tenue:#A9A0A2; --bordo:#3A3A40;
}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--rosa);color:var(--testo);
  font-family:"Barlow Condensed",Arial,sans-serif;font-size:18px;line-height:1.35}
header{padding:14px 16px 8px;border-bottom:4px solid var(--nero);background:var(--rosa)}
:root[data-theme="dark"] header{border-color:var(--bordo)}
.occhiello{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--tenue);font-weight:600}
h1{font-family:Literata,Georgia,serif;font-size:clamp(26px,7.2vw,40px);margin:6px 0 2px;letter-spacing:-.02em}
.sotto{font-size:14px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:6px;overflow-x:auto;
  padding:8px 12px;background:var(--rosa);border-bottom:2px solid var(--bordo)}
nav button{flex:0 0 auto;border:2px solid var(--nero);background:var(--carta);color:var(--testo);
  font:600 15px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.05em;
  padding:8px 14px;border-radius:999px}
:root[data-theme="dark"] nav button{border-color:var(--bordo)}
nav button[aria-current="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff}
main{padding:14px 12px 30px;max-width:900px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--carta);border:2px solid var(--bordo);border-radius:14px;padding:14px;margin-bottom:14px}
.tag{display:inline-block;background:var(--magenta);color:#fff;font-weight:700;font-size:12px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.tag.giallo{background:var(--giallo);color:var(--nero)}
h2{font-family:Literata,Georgia,serif;font-size:22px;margin:14px 2px 10px}
h3{font-size:21px;margin:8px 0 6px;letter-spacing:-.01em}
.cover{width:100%;border-radius:10px;border:1px solid var(--bordo);display:block}
.punti{list-style:none;margin:10px 0 0;padding:0}
.punti li{position:relative;padding-left:22px;margin-bottom:5px;font-size:17px}
.punti li:before{content:"";position:absolute;left:2px;top:8px;width:9px;height:9px;
  background:var(--magenta);border-radius:2px;transform:rotate(45deg)}
button.apri{width:100%;margin-top:12px;background:var(--nero);color:#fff;border:0;border-radius:10px;
  padding:12px;font:700 16px/1 "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase}
.lista{display:grid;gap:10px}
.riga{display:flex;gap:10px;align-items:center;background:var(--carta);border:2px solid var(--bordo);
  border-radius:12px;padding:8px;text-align:left;width:100%;color:var(--testo);font-family:inherit}
.riga img{width:56px;height:74px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--bordo)}
.riga .t{font-weight:700;font-size:18px;line-height:1.1}
.riga .d{font-size:13px;color:var(--tenue);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;background:var(--carta);border-radius:10px;overflow:hidden}
th{background:var(--blu);color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 6px;text-align:left}
td{padding:7px 6px;border-bottom:1px solid var(--bordo);font-size:17px}
td.n{text-align:center;font-weight:700;width:34px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
tr.primo td{background:var(--giallo);color:#121112;font-weight:700}
.mini{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px}
.match{border-bottom:1px solid var(--bordo);padding:8px 0}
.match:last-child{border-bottom:0}
.match .lato{display:flex;align-items:center;gap:8px;padding:2px 0}
.match .lato .nome{flex:1;font-size:17px;line-height:1.15}
.match .lato .gol{font-weight:700;font-size:19px;min-width:26px;text-align:right}
.match .fp{font-size:13px;color:var(--tenue);letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
.match .vinto .nome{font-weight:700}
.soffio{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bordo);font-size:17px}
.soffio:last-child{border-bottom:0}
/* impaginazione del numero */
.art{margin-top:4px}
.edit{scroll-margin-top:90px;background:#3A3A40;color:#fff;border-radius:12px;padding:16px 16px 14px;margin:10px 0 18px;position:relative}
.edit .k{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.08em;color:var(--giallo);font-size:15px;text-transform:uppercase}
.edit .t{font-family:Literata,Georgia,serif;font-style:italic;font-weight:400;font-size:22px;line-height:1.25;margin:6px 0 10px;color:#fff}
.edit p{font-family:Literata,Georgia,serif;font-style:italic;font-weight:300;font-size:17px;line-height:1.6;margin:0 0 10px;color:#e2dadb}
.edit p b{font-weight:600;color:#fff}
.edit .cens{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bbb;vertical-align:middle;border:1px solid #777;border-radius:4px;padding:0 4px}
.edit .f{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;color:var(--magenta);font-size:17px;text-align:right;margin-top:4px}
.rassegna{border:1px dashed var(--bordo);border-radius:10px;padding:8px 12px;margin:-6px 0 18px;font-size:14px;color:var(--tenue)}
.rassegna summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--tenue)}
.rassegna summary::-webkit-details-marker{display:none}
.rassegna .ap::after{content:"Apri ▾";color:var(--magenta);white-space:nowrap}
.rassegna[open] .ap::after{content:"Chiudi ▴"}
.rassegna .t{font-family:Literata,Georgia,serif;font-style:italic;font-size:17px;color:var(--testo);margin:10px 0 6px}
.rassegna p{font-family:Literata,Georgia,serif;font-style:italic;font-size:15px;line-height:1.55;margin:0 0 8px}
.rassegna .f{text-align:right;font-size:13px;margin-top:4px}
.edit .edimg{display:block;width:42%;max-width:150px;border-radius:8px;margin:2px 0 12px}
.edit .f span{color:#bbb;font-weight:400}
.art .sez{display:flex;align-items:flex-start;gap:10px;margin:26px 0 10px}
.art .sez:first-child{margin-top:12px}
.art .sez .em{font-size:23px;line-height:1.1;flex:0 0 auto}
.art .sez .tx{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;
  font-size:23px;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
.art .ap{font-family:Literata,Georgia,serif;font-size:17px;line-height:1.62;margin:0 0 12px}
.art .ap b{font-weight:600}
.art .rg{font-size:18px;line-height:1.5;margin:2px 0;display:flex;gap:8px;align-items:baseline}
.art .rg .em{flex:0 0 auto}
.art h4.vet{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.02em;margin:16px 0 4px;color:var(--magenta)}
.art hr.ah{border:0;border-top:1px solid var(--bordo);margin:20px 0}
.banda{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  border:2px solid var(--nero);border-radius:10px;padding:14px 10px;margin:6px 0 14px;background:var(--carta)}
:root[data-theme="dark"] .banda{border-color:var(--bordo)}
.banda .lt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.banda .lt img{width:56px;height:56px;border-radius:50%}
.banda .lt span{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:16px;line-height:1.1}
.banda .ct{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 6px}
.banda .gol{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:34px;
  line-height:1;color:var(--magenta);white-space:nowrap}
.banda .vs{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:24px;color:var(--tenue)}
.banda .fp{font-size:13px;color:var(--tenue);white-space:nowrap}
.premi{display:grid;gap:8px;margin:18px 0 4px}
.premio{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--bordo);
  border-radius:12px;padding:10px 12px;background:var(--carta)}
.premio .em{font-size:20px;flex:0 0 auto}
.premio .et{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--magenta);display:block}
.premio .vl{font-size:17px;line-height:1.4}
.soffio .d{display:block;font-size:13px;color:var(--tenue);text-transform:uppercase;letter-spacing:.04em}
.squadra{display:flex;align-items:center;gap:10px}
.squadra img{width:46px;height:46px;border-radius:50%}
.pill{display:inline-block;border:1px solid var(--bordo);border-radius:999px;padding:2px 9px;
  font-size:14px;margin:2px 4px 2px 0;color:var(--tenue)}
.rosa{margin-top:10px;display:none}
.rosa.on{display:block}
.rosa .rep{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta);
  font-weight:700;margin:8px 0 3px}
.rosa .g{display:flex;justify-content:space-between;border-bottom:1px dotted var(--bordo);padding:3px 0;font-size:16px}
.testo{white-space:pre-wrap;font-family:Literata,Georgia,serif;font-size:16px;line-height:1.55}
.gr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--bordo);font-size:15px}
.gr:last-of-type{border-bottom:0}
.gr .a,.gr .b{display:flex;align-items:center;gap:6px;min-width:0}
.gr .a{justify-content:flex-end;text-align:right}
.gr .mini{width:22px;height:22px;flex:none}
.gr .vinto span{font-weight:700}
.gr .ris{font-weight:700;white-space:nowrap}
.gvai{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;
  background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:12px 16px;width:100%;
  font:inherit;font-weight:700;font-size:17px;cursor:pointer;text-align:left}
.gvai span{font-size:22px;line-height:1}
.mini-cl{margin:0 0 12px}
.mini-cl h3{font-size:16px;margin:0 0 6px}
.mini-cl .r1{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px;border-bottom:1px solid var(--bordo)}
.mini-cl .r1:last-child{border-bottom:0}
.mini-cl .r1 .p{width:16px;color:var(--tenue);font-size:13px}
.mini-cl .r1 .nm{flex:1}
.mini-cl .r1 .mini{width:20px;height:20px}
.sfg-testa{scroll-margin-top:90px;background:#2B2B30;border-radius:16px;padding:18px 14px 12px;margin:30px 0 14px;text-align:center;color:#fff}
.sfg-testa h2{margin:0;font-size:30px;color:#fff;letter-spacing:.01em}
.sfg-testa .sotto{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--giallo);font-size:14px;margin:4px 0 10px}
.sfg-testa svg{display:block;width:100%;max-width:300px;margin:0 auto}
.sfg-testa .ago{font-size:14px;color:#ddd;margin-top:6px}
.sfg-testa .ago b{color:#fff}
.sfg-sotto{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta);font-size:14px;margin:0 2px 10px}
.sfg-premi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.sfg-premi .pr{background:var(--carta);border:2px solid var(--bordo);border-radius:12px;padding:10px 8px;text-align:center}
.sfg-premi .pr .em{font-size:22px}
.sfg-premi .pr .et{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);margin-top:2px}
.sfg-premi .pr img{width:40px;height:40px;border-radius:50%;margin:6px 0 2px}
.sfg-premi .pr .nm{font-weight:700;font-size:14px;line-height:1.15}
.sfg-premi .pr .vl{font-size:13px;color:var(--magenta);font-weight:700;margin-top:2px}
.sfg-pos{color:#1B7F3B;font-weight:700}
.sfg-neg{color:var(--magenta);font-weight:700}
.sfg-zero{color:var(--tenue)}
.sfg-ep{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sfg-ep .card{margin:0}
.sfg-ep h3{font-size:15px;margin:0 0 6px}
.sfg-ep .r1{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:14px;border-bottom:1px solid var(--bordo)}
.sfg-ep .r1:last-child{border-bottom:0}
.sfg-ep .r1 .mini{width:18px;height:18px}
.sfg-ep .r1 .nm{flex:1}
.sfg-nota{font-size:13px;color:var(--tenue);margin:10px 2px 0;line-height:1.4}
.chiudi{background:var(--magenta);color:#fff;border:0;border-radius:10px;padding:10px 16px;
  font:700 15px/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
footer{text-align:center;padding:18px 12px 26px;color:var(--tenue);font-size:14px}
.credito{margin-top:24px;font-size:11px;line-height:1.4;text-align:left;opacity:.55}
.credito a{color:inherit;text-decoration:none}
.credito a:hover{text-decoration:underline}
:root[data-theme="dark"] .credito{opacity:.7}
footer button{background:none;border:2px solid var(--bordo);color:var(--tenue);border-radius:999px;
  padding:8px 16px;font:600 14px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.06em}
.cover,.fpart{cursor:zoom-in}
.fpart{float:left;width:47%;max-width:270px;border-radius:10px;border:1px solid var(--bordo);display:block;margin:6px 14px 6px 0}
.art > :not(p):not(.fpart){clear:both}
.galleria{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}
.galleria img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--bordo);display:block}
.galleria .k{grid-column:1/-1;font:700 12px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);margin:2px 0 2px}
#lb{position:fixed;inset:0;z-index:999;background:#111114;display:none;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom pan-x pan-y}
#lb.on{display:block}
#lb img{display:block;margin:0 auto;max-width:100%;min-height:0;padding:56px 0 24px}
#lb.quadra{display:none}
#lb.on.quadra{display:flex;align-items:center;justify-content:center}
#lb.quadra img{max-height:100vh;padding:56px 0}
#lb button{position:fixed;z-index:2;border:1px solid rgba(255,255,255,.35);background:rgba(20,20,24,.6);color:#fff;font:700 22px/1 system-ui,sans-serif;width:44px;height:44px;border-radius:50%;cursor:pointer}
#lb .x{top:10px;right:10px}
#lb .tb{position:static;display:block;margin:18px auto 28px;width:auto;height:46px;border-radius:23px;padding:0 24px;font:700 16px/1 system-ui,sans-serif;flex:none}
#lb.on.quadra{flex-direction:column}
#lb.quadra img{max-height:calc(100vh - 120px)!important;padding:56px 0 0!important}
#lb img{padding-bottom:0!important}
.covwrap{position:relative;margin:10px 0}
.covwrap .cover{margin:0!important}
.covwrap .zona{position:absolute;padding:0;border:0;background:transparent;cursor:zoom-in;border-radius:4px}
.covwrap .zona:hover{outline:3px solid rgba(222,0,72,.55)}
.covhint{font-size:13px;color:var(--tenue);margin:4px 0 10px;text-align:right}
#lb .pr{left:10px;top:50%;transform:translateY(-50%)}
#lb .nx{right:10px;top:50%;transform:translateY(-50%)}
.sez.speciale{scroll-margin-top:90px}
</style>

<body>
<header>
  <div class="occhiello"><span id="hLega"></span><span id="hAgg"></span></div>
  <h1>La Gazzetta Cozze e Vongole</h1>
  <div class="sotto" id="hSotto"></div>
</header>
<nav id="nav"></nav>
<main>
  <section id="sec-prima" class="on"></section>
  <section id="sec-archivio"></section>
  <section id="sec-classifica"></section>
  <section id="sec-giornate"></section>
  <section id="sec-statistiche"></section>
  <section id="sec-squadre"></section>
  <section id="sec-mercato"></section>
  <section id="sec-numero"></section>
</main>
<footer>
  <div id="piede"></div>
  <p><button id="tema">Tema scuro</button></p>
  <p class="credito">Sito realizzato e curato da <a href="https://prosperialfonso.com" rel="author">Alfonso Prosperi</a></p>

o rose al completo.", "punti": ["Malen agli Sporting Heroes per 352 crediti", "Lautaro al Red Hot Buj: 311, secondo acquisto", "San Scrosoppi: 583 crediti solo in attacco", "L'infermeria arriva prima del campionato"], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 0 · Speciale Asta e 1ª Giornata · Stagione 2026 / 2027\n\n💰 NOTTE DI SPESE FOLLI: MALEN RE DELL'ASTA\n\nL'asta è chiusa, le rose sono fatte, i portafogli piangono. La Cozze e Vongole consegna *200 giocatori*, *8 squadre* e una certezza: in questa lega i soldi si spendono davanti.\n\n🥇 *Malen* · *352* _(Sporting Heroes Heisenberg FC)_\n🥈 *Lautaro* · *311* _(Red Hot Buj)_\n🥉 *Hojlund* · *272* _(S.S. Longobarda)_\n4️⃣ *Ramos G.* · *250* _(BAM)_\n5️⃣ *Thuram* · *225* _(Fc Presidente)_\n\nReparto per reparto: il portiere più pagato è *Maignan* a *97* (Red Hot Buj), il difensore d'oro è *Dimarco* a *106* (Sporting Heroes), a centrocampo comanda *Calhanoglu* a *114* (S.S. Longobarda). _Nessuno ha badato a spese, qualcuno nemmeno al resto._\n\n📊 STRATEGIE A CONFRONTO\n\n*San Scrosoppi FC* ha giocato all in sull'attacco: *583 crediti* per il reparto offensivo, con *Woltemade* e *Yildiz* a *171* a testa, e appena *111* per tutta la difesa. *Sventrapapere* ha fatto l'esatto contrario: *378* a centrocampo e l'attacco più leggero della lega (*292*). *Misrat* è il ragioniere del gruppo: due portieri a *1 credito* e *105* crediti ancora in cassaforte.\n\n💶 CREDITI RESIDUI\n\nMisrat *105* · San Scrosoppi FC *95* · BAM *19* · Red Hot Buj *4* · Sventrapapere *4* · S.S. Longobarda, Sporting Heroes e Fc Presidente *0*\n\n_Tre squadre hanno svuotato il salvadanaio fino all'ultima monetina: speriamo che a ottobre non servano svincolati._\n\n📉 IL CASO · L'INFERMERIA ARRIVA PRIMA DEL CAMPIONATO\n\nPrima ancora del fischio d'inizio, qualche squadra deve già sfogliare il bollettino medico. Il colpo più pesante è a *San Scrosoppi*: *Yildiz*, pagato *171*, è fermo per una frattura al piede e se ne riparla dopo la sosta di novembre, mentre *Bella-Kotchap* (*10*) starà fuori circa tre settimane. *Sventrapapere* ritroverà *McTominay* (*81*) solo dopo la sosta di ottobre. *Misrat* ha preso *Locatelli* a *9*: prezzo da saldo, ma il rientro è previsto nel 2027. Chiude la lista *Boga* (*8*, BAM), fermo 45 - 60 giorni.\n\n_A tutti loro un sincero in bocca al lupo. Alle rispettive squadre, un consiglio: pazienza e panchine lunghe._\n\n🗓️ 1ª GIORNATA · SI ALZA IL SIPARIO\n\n🔴 BAM vs S.S. LONGOBARDA\nBAM vs S.S. Longobarda\n\nDuello tra bomber di lusso: *Ramos G.* (*250*) contro *Hojlund* (*272*). In mezzo al campo sfida di regia tra *Paz N.* e *Calhanoglu*. _La Longobarda ha speso fino all'ultimo credito: ora deve dimostrare che ne valeva la pena._\n\n🔵 MISRAT vs FC PRESIDENTE\nMisrat vs Fc Presidente\n\nIl ragioniere contro lo spendaccione. *Misrat* si presenta con *Douvikas* e *Dybala* e 105 crediti mai spesi, *Fc Presidente* ha puntato forte su *Thuram* (*225*) e *Krstovic* (*88*) risparmiando sulla difesa, la più economica della lega (*101*). _Vince chi ha investito meglio, non chi ha investito di più._\n\n⚫ SPORTING HEROES vs RED HOT BUJ\nSporting Heroes vs Red Hot Buj\n\nIl big match della giornata vale *663 crediti* in due soli centravanti: *Malen* (*352*) contro *Lautaro* (*311*), i due acquisti più cari dell'asta faccia a faccia. Occhio anche a *Dimarco* da una parte e *Maignan* dall'altra. _Qui si capisce subito chi ha fatto l'affare e chi il danno._\n\n⚪ SVENTRAPAPERE vs SAN SCROSOPPI FC\nSventrapapere vs San Scrosoppi FC\n\nIl derby delle filosofie opposte, e pure dell'infermeria: centrocampo da *378* contro attacco da *583*. Sventrapapere senza *McTominay*, San Scrosoppi senza *Yildiz* e *Bella-Kotchap*. Tocca a *Kean* e *Diouf* da una parte, *Woltemade* ed *Esposito F.P.* dall'altra. _Vince chi ha la panchina più lunga._\n\n⏱️ IL FISCHIO D'INIZIO\n\nLa stagione della Cozze e Vongole parte *venerdì 11 settembre alle 20:45* dallo stadio *Penzo*: *Venezia - Fiorentina*, anticipo della 4ª giornata di Serie A. Sfida tra due grandi deluse, entrambe ancora a *zero punti* dopo tre giornate. _Primo pallone, primi voti, primi rimpianti._\n\n🏆 MVP DELL'ASTA · *Koopmeiners* _(27 crediti, Misrat: con Locatelli ai box sale forte nelle gerarchie bianconere)_\n😴 FLOP DELL'ASTA · *Yildiz* _(171 crediti, San Scrosoppi: investimento a lunga scadenza, primi dividendi attesi a fine novembre)_\n⚔️ LA SFIDA DA SEGUIRE · *Malen contro Lautaro* _(663 crediti di centravanti, uno contro l'altro)_", "cover": "img/n0_cover_f61e9bcf.jpg"}, {"num": 1, "tipo": "post", "data": "15 settembre 2026", "titolo": "PRESIDENTE DA URLO", "sommario": "Otto gol e 88 punti all'esordio: il Fc Presidente travolge Misrat e si prende la vetta.", "punti": ["Mastantuono 17.5, il voto della giornata", "Moreira da 14 abbatte gli Sporting Heroes", "Barella regala la vittoria alla Longobarda", "I BAM unica squadra a secco di gol"], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 1 · 1ª Giornata · Stagione 2026 / 2027\n\n📊 PRESIDENTE DA URLO: 88 PUNTI E OTTO GOL\n\nLa prima giornata consegna subito un padrone. *Fc Presidente* travolge Misrat con *88 punti*, il punteggio più alto di giornata, e si prende la vetta con la miglior differenza reti della lega. Alle sue spalle vincono anche *Red Hot Buj*, *Sventrapapere* e *S.S. Longobarda*, ma con margini ben più stretti.\n\nIl dato che pesa: *Misrat* fa *70 punti* ed è ultima, *San Scrosoppi* ne fa *68* ed è sesta. In una lega dove il primo gol scatta a *66* e poi se ne aggiunge uno ogni *3 punti*, non conta quanto fai ma contro chi lo fai.\n\n🔴 MOREIRA FA A PEZZI GLI SPORTING HEROES\nSporting Heroes 1 - 4 Red Hot Buj (67 - 75.5)\n\nIl big match dell'asta finisce in goleada. *Moreira* è un uragano da *14*, *Ramon* lo accompagna con un *10* da difensore, *Davis K.* aggiunge un solido *7*. Dall'altra parte *Malen*, l'uomo da *352 crediti*, risponde presente con un *10* pieno, ma resta solo: *De Gea* affonda a *4*, *Politano* si ferma a *5.5*, *Simeone* a *5.5*. Il Buj vince nonostante *Maignan* da *4.5* e nonostante abbia lasciato fuori *Coulibaly L.* da *13.5* e *Gueye* da *9.5*. _Quando vinci così, vuol dire che è proprio giornata._\n\n🔵 BARELLA PUNISCE I BAM DI UN SOFFIO\nBAM 0 - 1 S.S. Longobarda (63 - 68)\n\nLa partita più povera della giornata la decide un uomo solo: *Barella*, *10.5*, con *Abankwah* a *9* e *Ekkelenkamp* a *9.5* dalla panchina a completare l'opera. Serviva, perché la Longobarda ha rischiato grosso: *Martinez Jo.* da *2* in porta, *Calhanoglu* e *N'Dicka* nemmeno scesi in campo, *Hojlund* fermo a *5.5*. I BAM si aggrappano a *Paz N.* (*8*) e *Spinazzola* (*6.5*), ma con *Vicario* a *3* restano l'unica squadra a zero gol. _Sessantatré punti e niente da festeggiare._\n\n⚫ MASTANTUONO DA 17.5, MISRAT TRAVOLTA\nMisrat 2 - 8 Fc Presidente (70 - 88)\n\nIl risultato più pesante della giornata porta la firma di *Mastantuono*: *17.5*, voto da videogioco. Intorno a lui una squadra perfetta: *Thuram* *11.5*, *Vasquez* *8*, *Zaccagni* e *Svilar* *7.5*, *Mancini* *7*. La difesa più economica della lega, quella da *101 crediti*, è stata la migliore del turno. Misrat non ha fatto niente di male, anzi: *Kvernadze* *10*, *Rabiot* *7.5*, *Dybala* e *Atta* *6.5*. _È capitato il turno sbagliato: succede, ma fa male lo stesso._\n\n⚪ DOPPIO 10.5: SVENTRAPAPERE VOLA\nSventrapapere 3 - 1 San Scrosoppi FC (74.5 - 68)\n\n*Lobotka* e *Carlos Augusto*, *10.5* a testa, più *Diouf* a *7.5*: il centrocampo da *378 crediti* si prende la scena esattamente come previsto. San Scrosoppi si consola con *Esposito F.P.* da *10*, ma *Kabasele* a *4.5*, *Woltemade* a *5.5* e *Modric* a *5.5* pesano come macigni. _Il reparto da 583 crediti si è presentato in punta di piedi._\n\n📉 IL CASO · LE PANCHINE D'ORO DELLA PRIMA\n\nEsiste una classifica parallela, quella dei punti rimasti seduti, ed è impietosa. Gli *Sporting Heroes* perdono *1 - 4* tenendo fuori *Cancellieri* (*10*) e *Pulisic* (*7*). *Misrat* ne prende otto lasciando in tribuna *Tiago Gabriel* (*10*), *Maldini* (*10*) e *Fagioli* (*8*). E il *Fc Presidente* fa *88 punti* avendo in panchina *Scamacca*, *Pellegrino M.*, *Romero D.* e *Adzic*, tutti e quattro da *10*.\n\n_Quaranta punti seduti in panchina e ottantotto in campo. Alla prima giornata è un lusso, alla decima sarà un rimpianto._\n\n🏆 MVP DI GIORNATA · *Mastantuono* _(17.5)_\n😴 FLOP DI GIORNATA · *Martinez Jo.* _(2, e la Longobarda ha pure vinto)_\n⚔️ LA SFIDA DA SEGUIRE · _Presidente e Red Hot Buj appaiate a 3 punti ma con 12.5 punti di scarto_", "cover": "img/n1_cover_abf4cf63.jpg"}, {"num": 2, "tipo": "pre", "data": "18 settembre 2026", "titolo": "SI RIPARTE, POI LA SOSTA", "sommario": "Anteprima della seconda giornata: quattro squadre a 3 punti, quattro a zero e il turno che passa per l'Olimpico.", "punti": ["Due scontri diretti tra squadre dello stesso blocco", "La Longobarda perde Calhanoglu e Stones", "Il Presidente senza Vasquez per squalifica", "Si torna in campo solo il 10 ottobre"], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 2 · Anteprima 2ª Giornata · Stagione 2026 / 2027\n\n📊 SI PARTE, POI TRE SETTIMANE DI SOSTA\n\nLa lega è spaccata a metà: quattro squadre a *3 punti*, quattro a *zero*. Due sfide su quattro mettono di fronte squadre dello stesso blocco, quindi entro domenica qualcuno lascerà per forza il gruppo di testa. In vetta comanda *Fc Presidente* con *88 punti*, il miglior punteggio della prima giornata. E attenzione: questo è l'ultimo turno prima della maxi sosta, si torna in campo solo il *10 ottobre*.\n\n🔴 LO SCONTRO DEI DELUSI\nSan Scrosoppi FC vs Sporting Heroes\n\nSessantotto contro sessantasette alla prima, due sconfitte e la stessa faccia. Filo conduttore il Milan, con *Modric* da una parte e *Pulisic* dall'altra, entrambi attesi domenica sera contro il Lecce. San Scrosoppi si aggrappa ancora a *Esposito F.P.*, *Malen* deve ripetere il *10* e stavolta trovare compagni. _Chi perde resta a zero per tre settimane._\n\n🔵 LA LONGOBARDA PERDE DUE PEZZI ALLA VIGILIA\nS.S. Longobarda vs Sventrapapere\n\nBrutte notizie dall'infermeria nerazzurra: *Calhanoglu* salta Roma - Inter per un problema all'adduttore e *Stones* resta fuori tre o quattro settimane. La Longobarda perde due titolari e si aggrappa a *Barella*, già decisivo con il *10.5* della prima, e al rientro di *N'Dicka*. Dall'altra parte Sventrapapere schiera il blocco *Bastoni*, *Bisseck* e *Carlos Augusto* nella stessa partita, più *Lobotka* in Fiorentina - Napoli. _Stessa maglia, avversari al fanta._\n\n⚫ LAUTARO CONTRO DYBALA, ALL'OLIMPICO\nRed Hot Buj vs Misrat\n\nIl match dentro il match è servito, sabato alle *18:00*. Il Buj arriva dal *1 - 4* firmato *Moreira* (*14*), Misrat dai *70 punti* più inutili della storia recente, con *Carnesecchi*, *Gatti* e *Koopmeiners* impegnati in Juventus - Atalanta. _Settanta punti buttati non capitano due volte. O almeno, non dovrebbero._\n\n⚪ IL PRESIDENTE PERDE VASQUEZ PER SQUALIFICA\nFc Presidente vs BAM\n\nOtto gol contro zero, ma la capolista si presenta senza *Vasquez*, unico squalificato di tutto il turno dopo l'*8* dell'esordio. Restano *Mastantuono*, *17.5* all'esordio e già uomo copertina della lega, e la coppia romanista *Svilar* e *Mancini*. I BAM ritrovano *Wesley* e devono svegliare *Ramos G.*, *250 crediti* per un timido *5.5*. _Il Presidente può permettersi un'assenza, i BAM non possono permettersi un altro zero._\n\n📉 IL CASO · IL TURNO CHE PASSA PER L'OLIMPICO\n\nRoma - Inter, sabato alle *18:00*, è il vero arbitro della giornata: tutte e otto le squadre hanno almeno un uomo in campo. *Barella* contro *Bastoni* e *Carlos Augusto*, *Lautaro* contro *Dybala*, *Thuram* e *Svilar* nella stessa partita ma su fronti opposti di lega.\n\n_Un gol nerazzurro può far felici e disperati quattro squadre nello stesso istante._\n\n🏆 DA SEGUIRE · *Mastantuono* _(reduce dal 17.5 più clamoroso del turno)_\n😴 OSSERVATO SPECIALE · *Hojlund* _(272 crediti e un 5.5 all'esordio)_\n⚔️ LA SFIDA · _S.S. Longobarda contro Sventrapapere, chi perde saluta la vetta_", "cover": "img/n2_cover_e3c54cf9.jpg"}, {"num": 3, "tipo": "post", "data": "21 settembre 2026", "titolo": "IL BUJ SOLO AL COMANDO", "sommario": "Lautaro da 14 lancia il Red Hot Buj, la Longobarda vince col minimo e gli Sporting Heroes restano ultimi.", "punti": ["Martinez L. 14: fuga in solitaria del Buj", "La Longobarda segna esatta a quota 66", "I BAM fanno più punti e pareggiano", "Misrat: 146 punti totali e zero in classifica"], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 3 · 2ª Giornata · Stagione 2026 / 2027\n\n📊 IL BUJ IN FUGA, SPORTING HEROES ULTIMI\n\nDue vittorie su due per *Red Hot Buj* e *S.S. Longobarda*, ma il dato che grida vendetta è un altro: il *Fc Presidente* ha il miglior punteggio totale della lega (*157*) ed è terzo, *Misrat* è settimo con *146*. _Il fanta non premia chi fa punti, premia chi li fa al momento giusto._\n\n🔴 LAUTARO DA 14, IL BUJ SI PRENDE LA VETTA\nRed Hot Buj 5 - 4 Misrat (80.5 - 76)\n\nPartita da montagne russe, decisa dall'uomo che all'esordio non si era presentato. *Martinez L.* si sveglia e firma un *14* che vale la fuga in solitaria, con *Moreira* (*10*) a ripetersi dopo la prima giornata e la difesa che regge grazie a *Pavlovic* e *Molina N.*, entrambi *7.5*. Misrat fa tutto quello che poteva: *Rabiot* e *Maldini* a *10*, *Kvernadze* a *9.5*, *Dybala* a *7*. Settantasei punti, il terzo punteggio di giornata, e ancora zero in classifica. _A questo punto non è sfortuna, è una maledizione._\n\n🔵 BREMER DECIDE, LA LONGOBARDA VINCE COL MINIMO\nS.S. Longobarda 1 - 0 Sventrapapere (66 - 61.5)\n\nLa Longobarda segna esattamente a quota *66*, la soglia del primo gol: un punto in meno ed era *0 - 0*. Merito di *Bremer* (*10*), perché *Barella* si ferma a *5* e *Martinez Jo.* a *4.5*. Sventrapapere affonda a *61.5*, il peggior punteggio di giornata. _Gli Sventra non hanno proprio tirato in porta._\n\n⚫ SAN SCROSOPPI RIBALTA GLI SPORTING HEROES\nSan Scro
