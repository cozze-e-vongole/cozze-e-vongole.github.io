27 crediti*, ma *200* stanno nelle casse di Misrat e San Scrosoppi: per tutti gli altri si tratta praticamente a scambio secco.\n\n🏬 LE VETRINE\n\nMISRAT · 105 crediti\nIl più ricco della lega, con otto centrocampisti in rosa e due portieri pagati *1 credito*. Ha i soldi per il conguaglio e un reparto da sfoltire. _Chi cerca un centrocampista sa dove bussare._\n\nSAN SCROSOPPI · 95 crediti\nSei attaccanti per *583 crediti* e la difesa più leggera del torneo a *111*. _Vende attacco, compra difesa: più chiaro di così._\n\nFC PRESIDENTE · 0 crediti\nAttacco da *482 crediti* in sei punte, difesa da *101*. Con la cassa vuota può muoversi solo a scambio, ma ha la merce che tutti vorrebbero.\n\nSVENTRAPAPERE · 4 crediti\nCentrocampo da *378 crediti*, il migliore della lega, e attacco da *292*, il più leggero. _Un centrocampista in meno e una punta in più: serve quello._\n\nSPORTING HEROES · 0 crediti\nSessanta crediti spesi in tre portieri e un attacco deserto dietro il big. Ultimo posto e niente cassa per rimediare.\n\nS.S. LONGOBARDA · 0 crediti\nSeconda in classifica ma con la difesa da *131 crediti* e l'infermeria che si è già fatta sentire. _Vince col minimo sindacale: prima o poi il minimo non basta._\n\nBAM · 19 crediti\nCentrocampo pieno di bonus, difesa da rivedere e un solo punto in due partite.\n\nRED HOT BUJ · 4 crediti\nPrimo in classifica, nessuna fretta. Il centrocampo è il più economico della lega, ma per ora funziona tutto. _Finché gira, ha ragione._\n\n📞 VOCI DI MERCATO\n\n_Trattative inventate dalla redazione, ma gli incastri sono veri._\n\n*Sventrapapere e San Scrosoppi*: una punta dal reparto sovraffollato verso l'attacco più povero della lega, in cambio di un centrocampista.\n\n*Fc Presidente e Sporting Heroes*: sei attaccanti da una parte, buoni difensori dall'altra. Scambio secco, nessuno dei due ha un credito.\n\n*Misrat e Red Hot Buj*: un centrocampista dal reparto più affollato verso la capolista, con i crediti di Misrat a fare da lubrificante.\n\n📸 LA FOTOGRAFIA\n\nDopo due giornate comanda *Red Hot Buj* a punteggio pieno insieme alla *S.S. Longobarda*, mentre il *Fc Presidente* insegue con il miglior punteggio totale della lega. In coda *Misrat* e gli *Sporting Heroes*, a zero punti ma per motivi opposti: uno fa punti e perde lo stesso, l'altro proprio non ne fa.\n\n💰 IL PIÙ RICCO · *Misrat* _(105 crediti e il centrocampo più affollato)_\n📉 IL PIÙ AL VERDE · *Sporting Heroes*, *Fc Presidente* e *S.S. Longobarda* _(zero crediti in cassa)_", "cover": "img/n3_5_cover_a5c56713.jpg"}, {"num": 4, "tipo": "pre", "data": "8 ottobre 2026", "titolo": "FINALMENTE SI RIPARTE", "sommario": "Edizione straordinaria dopo la sosta: la pagella delle nazionali, chi torna intero e chi no, e le quattro sfide della 3ª giornata.", "punti": ["Red Hot Buj contro Fc Presidente, prima contro terza", "San Scrosoppi senza Yildiz fino a dicembre", "BAM: fuori Gudmundsson, Raimondo e Boga", "Misrat a zero con 146 punti: ora o mai più"], "cover": "img/n4_cover_089cda14.jpg", "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 4 · Edizione straordinaria · Anteprima 3ª Giornata · Stagione 2026 / 2027\n\n🚨 FINALMENTE SI RIPARTE\n\nDiciannove giorni senza fanta, due turni di nazionali e un'infermeria che si è riempita più del previsto. Da sabato alle *15:00* si torna a fare sul serio: in testa *Red Hot Buj* e *S.S. Longobarda* a *6 punti*, il *Fc Presidente* insegue a *4* con il miglior totale della lega, in fondo *Misrat* e *Sporting Heroes* ancora a zero. _La sosta è finita, le scuse pure._\n\n🩺 LA PAGELLA DELLA SOSTA\n\nPrima di parlare delle partite, il bollettino: chi è tornato intero dalle nazionali e chi no.\n\n✅ *Red Hot Buj* · Unico guaio *Gueye*, operato alla caviglia e fuori fino a gennaio. Per il resto la capolista riparte al completo.\n✅ *S.S. Longobarda* · Solo il dubbio *Stones*, che si allena ancora a parte per un problema ai flessori. Tutto il resto è in ordine.\n🟡 *Sporting Heroes* · *Dimarco* ha recuperato dalla distorsione e *Malen* c'è, ma rischia di partire dalla panchina. Si ferma invece *Raspadori*, tornato dall'Italia con una distrazione alla coscia.\n🟡 *Fc Presidente* · *Jones C.* fermo per gli adduttori fino a fine ottobre, *Muric* rientrato dal Kosovo con un problema fisico.\n🟡 *Misrat* · *Locatelli* resta fuori fino a febbraio dopo l'operazione al menisco e *Pompei* salta il turno per una frattura a un dito.\n❌ *Sventrapapere* · *Santos A.* fuori fino alla seconda metà di ottobre, *Cristante* e *Kean* in dubbio per Como - Roma e *McTominay* ancora in attesa del via libera dopo l'intervento.\n❌ *BAM* · *Gudmundsson A.* con la spalla lussata, *Raimondo* fuori un mese per il tendine d'Achille, *Boga* fermo fino a metà novembre e *Kolo Muani* operato a un dito, anche se dovrebbe esserci.\n❌ *San Scrosoppi* · La più colpita. *Yildiz* è operato al piede e rientra a dicembre, *Saelemaekers* deve operarsi alla caviglia e se ne riparla nel 2027, *Odgaard* è fuori fino a fine mese e *Colombo* salta Genoa - Fiorentina.\n\n_Le nazionali non danno punti al fanta, ma a qualcuno li hanno già tolti._\n\n━━━━━━━━━━━━━━━\n\n🔴 I DUE MIGLIORI ATTACCHI, PRIMA CONTRO TERZA\nRed Hot Buj vs Fc Presidente\n\nÈ la partita del turno: la capolista contro la squadra con più gol fatti (*10*) e più punti totali (*157*). Il filo conduttore è Inter - Parma, sabato alle *18:00*, con *Martinez L.* da una parte e *Thuram* dall'altra. Occhio però: *Lautaro* è rientrato dalla nazionale dopo i compagni e per la Gazzetta dello Sport l'Inter potrebbe partire con *Bonny*. Il Presidente deve rinunciare a *Jones C.* e tenere d'occhio *Muric*, ma ha *Mastantuono* e *Zaccagni* già decisivi. _Chi vince si prende la vetta, chi perde capisce che non è un campionato per tutti._\n\n🔵 LO SCONTRO DELLE INFERMERIE\nSventrapapere vs BAM\n\nDue squadre che dalla sosta escono con le ossa rotte. Gli Sventrapapere si aggrappano al blocco nerazzurro *Bastoni*, *Bisseck* e *Carlos Augusto*, e a quel *Bonny* che potrebbe sorprendere tutti contro il Parma. I BAM contano gli assenti e devono svegliare *Ramos G.*, oltre a schierare finalmente *Konè M.*, lasciato in panchina col *14* nell'ultima giornata. _Vince chi ha meno giocatori in tribuna._\n\n⚫ MISRAT ALL'ULTIMA SPIAGGIA\nMisrat vs San Scrosoppi\n\n*146 punti* totali, il terzo miglior attacco della lega e *zero* in classifica: Misrat non ha più scuse e nemmeno tempo. Dall'altra parte un San Scrosoppi dimezzato, senza *Yildiz*, *Saelemaekers*, *Odgaard* e *Colombo* in un colpo solo. Domenica sera Cagliari - Juventus porta in campo *Gatti* e *Koopmeiners* da una parte, mentre *Dybala* gioca all'ora di pranzo a Como. _Se Misrat non vince nemmeno stavolta, conviene chiamare un esorcista._\n\n⚪ ULTIMI CONTRO L'UNICA PORTA INVIOLATA\nSporting Heroes vs S.S. Longobarda\n\nGli Sporting Heroes, ultimi a zero, contro l'unica squadra che non ha ancora preso gol. La Longobarda vince col minimo e lo fa bene: *Bremer* e la difesa reggono, *Barella* deve ritrovare il *10.5* dell'esordio. Gli Sporting Heroes ritrovano *Dimarco* e sperano che *Malen*, *352 crediti*, entri in fretta in Como - Roma. Senza *Raspadori* e con *Pulisic* atteso a Sassuolo, serve una domenica perfetta. _Tre settimane a pensare all'ultimo posto: adesso o mai più._\n\n📉 IL CASO · IL SABATO NERAZZURRO\n\nInter - Parma, sabato alle *18:00*, tocca quasi tutta la lega: *Martinez L.* e *Thuram*, *Barella* e *Stones*, *Bastoni*, *Bisseck*, *Carlos Augusto* e *Bonny*, *Dimarco* ed *Esposito F.P.*. E se davvero parte *Bonny* al posto di *Lautaro*, la capolista perde il suo uomo migliore proprio nel giorno del big match.\n\n_Una scelta di formazione dell'Inter può decidere la vetta del fanta._\n\n📌 PROMEMORIA · Formazioni da schierare prima di Genoa - Fiorentina, sabato alle *15:00*. Occhio alla difesa: con il modificatore attivo, portiere e difensori in campo valgono fino a *5 punti* in più. Il turno si chiude lunedì sera con Torino - Udinese.\n\n🏆 DA SEGUIRE · *Bonny* _(titolare a sorpresa contro il Parma?)_\n😴 OSSERVATO SPECIALE · *Malen* _(352 crediti, disponibile ma verso la panchina)_\n⚔️ LA SFIDA · _Red Hot Buj contro Fc Presidente, i due migliori attacchi per la vetta_", "editoriale": {"titolo": "Ordine, disciplina e difesa a tre. Nerazzurra.", "firma": "Il Mazzulaturo", "testo": "Diciannove giorni di sosta li ho passati come si deve: a sfogliare cataloghi di moto, che prima o poi qualcosa in garage arriva, e a mettere in fila i pensieri. Il fanta è una cosa seria, e una lega seria ha bisogno di qualcuno che metta ordine. Eccomi.\nPrima regola: la difesa si fa con gli interisti. *Bastoni*, *Bisseck*, *Carlos Augusto*. Gli altri schierano difensori, io schiero una filosofia. Chi ha ancora gente della Juventus là dietro si accomodi pure, la Serie B del fanta ha sempre posti liberi.\nSeconda regola: chi fa 146 punti e zero in classifica non parla. *Misrat*, te lo dico con affetto: a casa mia una squadra così veniva mandata a letto senza cena.\nTerza regola: i soldi si spendono con criterio. *352 crediti* su *Malen* per vederlo in panchina a Como? Agli *Sporting Heroes* consiglio un corso serale di economia domestica. Lo tiene il capofamiglia, come si faceva una volta.\nSabato tocca ai *BAM*. Hanno mezza rosa in infermeria e il resto in confusione. Io arrivo, parcheggio, faccio il risultato e me ne vado. Come sempre."}}, {"num": 5, "tipo": "post", "data": "13 ottobre 2026", "titolo": "TRE SU TRE, IL BUJ SCAPPA", "sommario": "Il Red Hot Buj vince anche la terza e scappa a 9, la Longobarda pareggia 4 - 4, il Mazzulaturo batte i BAM e il Presidente lascia un 15 in panchina.", "punti": ["Red Hot Buj a 9 punti, solo in vetta", "Krstovic da 15 in panchina: il Presidente perde 1 - 0", "Sporting Heroes 4 - 4 Longobarda, otto gol", "Primo punto per Misrat, Sporting Heroes e BAM a 1"], "cover": "img/n5_cover_a64f96d8.jpg", "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 5 · 3ª Giornata · Stagione 2026 / 2027\n\n📊 TRE SU TRE, IL BUJ SCAPPA\n\n*Red Hot Buj* vince anche la terza e va a *9 punti*, da solo in vetta. La *S.S. Longobarda* perde il primo pezzo per strada con un pareggio da otto gol, gli *Sventrapapere* salgono al terzo posto e il *Fc Presidente* si ferma a *64.5* con un *15* seduto in panchina. In fondo tre squadre a *1 punto*, e finalmente anche *Misrat* e *Sporting Heroes* hanno mosso la classifica. _Il calendario è andato come doveva andare, almeno per uno._\n\n🔴 UN GOL BASTA, IL BUJ FA TRE SU TRE\nRed Hot Buj 1 - 0 Fc Presidente (67 - 64.5)\n\nSessantasette punti e un solo gol, ma al Buj basta: *Ramon* da *7*, il resto della squadra tutta tra il *5* e il *6.5*, e *Pinamonti* da *10* lasciato in panchina senza che nessuno se ne accorgesse. Il Presidente fa peggio: *Svilar* senza voto, *Vasquez* da *3*, *Scamacca* non gioca, e il *10* di *Thuram* non basta ad arrivare a quota *66*. Nel frattempo *Krstovic* fa *15* in panchina. _La capolista non convince ma vince. Il Presidente convince ancora meno e perde._\n\n🔵 OTTO GOL E NESSUN VINCITORE\nSporting Heroes 4 - 4 S.S. Longobarda (77 - 76.5)\n\nLa partita più bella della giornata finisce in parità per mezzo punto. Gli Sporting Heroes fanno *77*, il loro miglior punteggio stagionale, con *De Bruyne* da *13.5* e *Kessiè* entrato dalla panchina con un *10*. La Longobarda risponde con *Calhanoglu* e *Ekkelenkamp*, entrambi da *10*, e con *Barella* che non scende in campo. E poi c'è *Malen*: *352 crediti*, titolare, *3.5*. _Il primo punto degli Sporting Heroes vale quanto una vittoria. Il primo pareggio della Longobarda, quasi quanto una sconfitta._\n\n⚫ IL MAZZULATURO MANTIENE LA PAROLA\nSventrapapere 3 - 2 BAM (74 - 70.5)\n\nDopo una settimana di frecciatine, la partita la vincono gli Sventrapapere, con *Isaksen* da *10* entrato dalla panchina e *Butez* da *7* al posto di *Provedel*. *Bastoni* non gioca, ma la difesa interista regge lo stesso con *Carlos Augusto* e *Bellanova* da *7*. I BAM fanno la partita migliore della loro stagione, *Orsolini* da *10.5* e *Kolo Muani* da *9* con un dito operato, e perdono lo stesso. _Chi provoca deve poi vincere. Stavolta è successo._\n\n⚪ DUE PRIMI PUNTI E UN MEZZO PUNTO\nMisrat 2 - 2 San Scrosoppi (71 - 71.5)\n\nMisrat muove la classifica alla terza giornata, con *Rabiot* e *Maldini* da *10* e quattro titolari senza voto. San Scrosoppi, con la rosa ereditata e dimezzata, trova un *10* da *Tavares N.* e un *7.5* da *Modric*, e si ferma a *71.5*: mezzo punto sotto quota *72*, cioè il terzo gol e la vittoria. _Misrat ha finalmente un punto. San Scrosoppi ne ha persi due per mezzo._\n\n📉 IL CASO · QUINDICI PUNTI IN PANCHINA\n\nIl Fc Presidente perde *1 - 0* facendo *64.5* punti. In panchina c'era *Krstovic* con un *15*. Al posto di *Diao* (*5.5*) la squadra arrivava a *74*, tre gol, e la partita la vinceva. È la panchina più pesante della stagione, davanti al *14* di *Konè M.* dei BAM della scorsa giornata.\n\n_Il miglior fantallenatore della lega, per ora, è quello che non ha più giocatori da lasciare fuori._\n\n🎲 LO SFIGOMETRO · Dopo tre giornate il più sfortunato resta *Misrat*, con *4.4 punti* rubati dal calendario: sarebbe secondo. I più fortunati sono *Red Hot Buj* e *S.S. Longobarda*, con *3 punti* in regalo a testa. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *De Bruyne* _(13.5)_\n😴 FLOP · *Vasquez* _(3, e Malen a 3.5 con 352 crediti)_\n⚔️ LA SFIDA · _Red Hot Buj a 9, poi la Longobarda a 7: la prossima giornata può riaprire o chiudere tutto_", "editoriale": {"titolo": "Svraaang.", "firma": "Il Mazzulaturo", "testo": "Non a caso, *Buj* si chiama Buj perché ha il bujio... de culo. Detto questo, va ammesso che quest'anno, a differenza degli anni passati, può sperare nel quarto posto.\nCome al solito, gli *Sven* sventrano, i *BAM* bambineggiano e i polli si appellano (o appollonano) a santi e rituali apotropaici, anche se privi di materia prima (i gabbasisi ndr).\nPer capire il trend di questo campionato, sculate a parte, si dovrà aspettare almeno la 12ª giornata, ma sia il campionato di Serie A che la lega C&V stanno già emettendo i primi verdetti: [censura] E PUSILLANIMI NON ENTRERANNO NEL REGNO DEI CIELI!!!!", "replica": {"etichetta": "📰 Dalla rassegna stampa · la versione della redazione", "titolo": "Arrivo, parcheggio, faccio il risultato. Fatto.", "testo": "Risultato in tasca. Avevo scritto: arrivo, parcheggio, faccio il risultato e me ne vado. Fatto. *3 - 2*, terzo posto, e un pensiero affettuoso a chi per una settimana ha fatto il tifo contro.\nI *BAM* si erano presentati con *Orsolini* da *10.5* e *Kolo Muani* da *9*, e per un attimo ci hanno creduto. Rispetto per lo sforzo, ma nel 2026 i BAM hanno fatto la loro miglior partita della stagione e hanno perso lo stesso. Non è sfortuna, è gerarchia.\nLo confesso: la formazione l'ha fatta il saggio. *Isaksen* dalla panchina da *10*, *Butez* in porta da *7*. Il saggio sceglie, io incasso. Si chiama divisione dei ruoli, come in ogni famiglia che funziona. Su *Bastoni* che non è sceso in campo sorvoliamo: la difesa nerazzurra vince anche in nove.\nQuando sei davanti, dietro senti solo rumore. Da terzo in classifica lo sento già. Dalla vetta, meglio.", "firma": "La redazione, a nome del Mazzulaturo"}, "immagine": "img/n5_editoriale_e49ee878.jpg"}, "foto_partite": {"sporting_heroes|longobarda": "img/n5_foto0_5226b5a2.jpg", "sventrapapere|bam": "img/n5_foto1_436a070b.jpg", "misrat|san_scrosoppi": "img/n5_foto2_789e8046.jpg", "red_hot_buj|fc_presidente": "img/n5_foto3_f1837b86.jpg"}, "foto_copertina": "img/n5_foto_copertina_9e2d9b85.jpg"}, {"num": 6, "tipo": "post", "data": "20 ottobre 2026", "titolo": "QUATTRO SU QUATTRO, IL BUJ NON SI FERMA", "sommario": "Il Buj a 12 a punteggio pieno, le papere a -3. Misrat 6 - 0 con Varela da 15.5 in panchina, De Bruyne sbaglia il rigore del 4 - 4", "punti": ["Red Hot Buj a 12, gli Sventrapapere inseguono a 9", "Misrat 6 - 0 alla Longobarda: 81 punti e cinque cambi dalla panchina", "Sventrapapere 5 - 0 al Presidente, Carlos Augusto da 11", "BAM 4 - 4 Sporting Heroes: Raimondo 17.5, De Bruyne sbaglia il rigore"], "cover": "img/n6_cover_802f0d59.jpg", "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 6 · 4ª Giornata · Stagione 2026 / 2027\n\n📊 QUATTRO SU QUATTRO, IL BUJ NON SI FERMA\n\n*Red Hot Buj* vince anche in casa di San Scrosoppi e sale a *12 punti*, a punteggio pieno. Dietro gli *Sventrapapere* rispondono con un *5 - 0* al Presidente e restano a *3 punti* dalla vetta, mentre la *S.S. Longobarda* prende sei gol da *Misrat* e resta terza solo per il totale. In coda Misrat sale a *4* e scavalca Presidente e San Scrosoppi, i BAM e gli Sporting Heroes si dividono un *4 - 4* e restano ultimi a *2*. È la giornata delle goleade: undici gol in due partite e il punteggio più basso della stagione. _Il Buj non convince mai e vince sempre. Comincia a essere un'abitudine._\n\n🔴 DUE GOL BASTANO, IL BUJ FA POKER\nSan Scrosoppi 0 - 2 Red Hot Buj (60 - 69)\n\nPer il Buj è la vittoria più facile della stagione, e non per merito suo. *Berardi* da *10* e *Moreira* da *8* fanno il risultato, mentre *Maignan* chiude a *4.5* con *Falcone* da *7* in panchina insieme a *Gaetano* e *Liberali* da *10*. Dall'altra parte San Scrosoppi tocca il fondo: *Milinkovic-Savic* senza voto, al suo posto entra *Caprile* con un *1.5*, e nessun titolare va oltre il *7.5* di *Tavares N.*. *60 punti*, il punteggio più basso della stagione. _Quattro su quattro, e la vetta si allontana per tutti._\n\n🔵 SEI GOL E UNA PANCHINA DA RECORD\nS.S. Longobarda 0 - 6 Misrat (65.5 - 81)\n\nMisrat fa *81*, il miglior punteggio della giornata, con cinque titolari senza voto. Ci pensano i cambi: *Calò* da *11.5*, *Douvikas* da *10*, *Tiago Gabriel* da *7*, e in mezzo al campo *Rabiot* da *11*. Il paradosso è che in panchina restava anche *Varela G.* con un *15.5*, il voto più alto mai lasciato fuori quest'anno. La Longobarda non si presenta: *Bremer* ed *Ekkelenkamp* da *4.5*, solo *Barella* sopra il sette, e il *10* di *Castro S.* entrato dalla panchina non basta a toccare quota *66*. _Misrat ha il miglior totale della lega, 298 punti, ed è quarto. Lo Sfigometro ringrazia._\n\n⚫ CINQUE GOL E UN PORTIERE A ZERO\nFc Presidente 0 - 5 Sventrapapere (65 - 78.5)\n\nGli Sventrapapere giocano la partita perfetta: *Carlos Augusto* da *11*, *Isaksen* e *Bonny* da *10*, la difesa interista che vale due punti di modificatore, e per sicurezza in panchina *Adams C.* e *Adams A.* da *10*. Il Presidente invece parte da zero, nel senso letterale: *Muric* prende quattro gol a Frosinone e chiude a *0*, con *Stankovic F.* da *12* seduto in panchina. *Krstovic* e *Thuram* fanno *9.5* a testa, ma con *Mancini* e *Adzic* senza voto la squadra si ferma a *65*, a un punto dal primo gol. _Cinque gol, e il Mazzulaturo torna a tre punti dalla vetta._\n\n⚪ OTTO GOL, UN RIGORE SBAGLIATO E NESSUN VINCITORE\nBAM 4 - 4 Sporting Heroes (76.5 - 75)\n\nLa partita più pazza della giornata. I BAM trovano *Raimondo* con una tripletta da *17.5*, il voto più alto della stagione insieme al *Mastantuono* della prima giornata, e *Paz N.* da *11*. Gli Sporting Heroes rispondono con *Simeone* da *14* e *Lulli* da *10* entrato dalla panchina, poi *De Bruyne* si presenta sul dischetto e sbaglia: *2* in pagella e pareggio servito. Restano tutte e due a *2 punti*, ultime insieme. _Due squadre che si fanno otto gol e stanno in fondo. Il calcio è strano, il fanta di più._\n\n📉 IL CASO · IL RIGORE DI DE BRUYNE\n\nGli Sporting Heroes chiudono a *75*, i BAM a *76.5*. *De Bruyne*, *5* in pagella, sbaglia un rigore e scende a *2*. Senza quel tiro la squadra arrivava a *78*, cioè *5 gol*, e vinceva *5 - 4*. Con il rigore segnato sarebbe arrivata a *81*: sei gol e tre punti. Restano un pareggio e il *10* di *Gila* in panchina.\n\n_Un rigore sbagliato vale tre punti in meno in pagella e due in classifica._\n\n🎲 LO SFIGOMETRO · Dopo quattro giornate *Misrat* resta il più sfortunato, con *4.4 punti* rubati dal calendario: con quelli sarebbe primo. Il più fortunato è *Red Hot Buj*, *4.7 punti* in regalo, e gli Sporting Heroes a *-3.9* sarebbero quarti. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *Raimondo* _(17.5, tripletta)_\n😴 FLOP · *Caprile* _(1.5, entrato per Milinkovic-Savic)_\n⚔️ LA SFIDA · _Red Hot Buj a 12, Sventrapapere a 9: la quinta giornata dice se è un campionato a due_", "editoriale": {"titolo": "Come volevasi dimostrare…", "firma": "Il Mazzulaturo", "testo": "Un'altra figuraccia de *Los Pollos* che sì, cambiano nome, ma non la sostanza.\n*Buj* ce l'ha fatta per il rotto della cuffia, ma qualcun'altro s'è rotto qualcos'altro…\n*Fauni* con la squadra scelta dallo Zecchino d'oro è giustificato, l'albanese ha sculato, *Davide* cede il passo e il presidente è stato sventrato come un tacchino alla vigilia del 4 luglio…\nSiamo ancora ai nastri di partenza, ma già si profila la rankine dei *Masters & Slaves*.\n[censura]: date un occhio alla classifica…", "replica": {"etichetta": "📰 Dalla rassegna stampa · la versione della redazione", "titolo": "Caro Buj, ti scrivo.", "testo": "Caro *Buj*, ti scrivo perché ormai sei l'unico argomento. Quattro vittorie su quattro, dodici punti, e domenica hai fatto *69* con *Maignan* da *4.5* e due da *10* lasciati in panchina. Hai vinto lo stesso. Non è merito, è fortuna, e adesso c'è pure uno strumento che la misura: lo Sfigometro ti regala *4.7 punti*, il più fortunato della lega. Quando ti chiedono il segreto, rispondi \"il calendario\". Almeno sei onesto.\nNoi intanto facciamo quello che va fatto. *5 - 0* al Presidente, *78.5 punti*, e la difesa che tutti ridevano: *Carlos Augusto* da *11*, *Bastoni*, *Bisseck*, due punti di modificatore. Lo dico dalla prima giornata, la difesa si fa con gli interisti, e lo ripeto finché non lo scrivono sul regolamento.\nUna parola anche per *Misrat*: *298 punti*, il totale più alto di tutti, e quarto posto. Hai fatto *81* con cinque titolari senza voto e *Varela* da *15.5* a guardare. Sei il più sfortunato della lega e il più disordinato, le due cose insieme sono quasi un'arte.\nE a *San Scrosoppi*, che chiude a *60* con un portiere da *1.5*: ricorda che il fanta si gioca con undici giocatori. Possibilmente con il voto.\nCaro Buj, il distacco è di tre punti. Domenica prossima parcheggio, faccio il risultato e me ne vado. Tu intanto goditi la vetta, che è in affitto.", "firma": "La redazione, a nome del Mazzulaturo"}}, "foto_copertina": "img/n6_foto_copertina_d4275647.jpg", "foto_partite": {"san_scrosoppi|red_hot_buj": "img/n6_foto0_df462477.jpg", "longobarda|misrat": "img/n6_foto1_fa59a7f7.jpg", "fc_presidente|sventrapapere": "img/n6_foto2_160109f4.jpg", "bam|sporting_heroes": "img/n6_foto3_f3d7897d.jpg"}}, {"num": 7, "tipo": "post", "data": "26 ottobre 2026", "titolo": "IL BUJ CADE, GLI SVENTRAPAPERE VOLANO IN VETTA", "sommario": "Prima sconfitta per il Buj, 0 - 4 con la Longobarda. Gli Sventrapapere vincono per un punto e sono primi per totale, Krstovic 15.5", "punti": ["Sventrapapere e Buj a 12, decide il totale", "Red Hot Buj 0 - 4 Longobarda: prima sconfitta, in dieci", "Sporting Heroes 3 - 4 Sventrapapere: Meret 3.5, Skorupski 7 in panchina", "Krstovic 15.5 e Misrat ancora sopra quota 80"], "cover": "img/n7_cover_9a6bae8a.jpg", "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 7 · 5ª Giornata · Stagione 2026 / 2027\n\n📊 IL BUJ CADE, GLI SVENTRAPAPERE VOLANO IN VETTA\n\nAlla quinta giornata il *Red Hot Buj* perde per la prima volta, e lo fa nel modo peggiore: *0 - 4* in casa contro la *S.S. Longobarda*, con *63 punti* e tre titolari senza voto. Ne approfittano gli *Sventrapapere*, che battono gli Sporting Heroes per un punto e salgono in testa: *12 punti* come il Buj, ma davanti per il totale, *363.5* contro *355*. La Longobarda è terza a *10*, Misrat e Presidente vincono e salgono a *7*. In fondo niente di nuovo: San Scrosoppi a *4*, Sporting Heroes e BAM ancora a *2* e ancora senza vittorie. _La vetta non era in vendita. Era in affitto, e il contratto è scaduto._\n\n🔴 IL BUJ SI SVEGLIA SECONDO\nRed Hot Buj 0 - 4 S.S. Longobarda (63 - 76.5)\n\nLa prima sconfitta del Buj arriva con tutti gli ingredienti: *Pinamonti*, *Moreira* e *Solet* senza voto, tre cambi usati e una squadra che finisce in dieci. Dalla panchina entrano *Gaetano* da *5.5*, *Monteiro J.* da *5* e *Vojvoda* da *5.5*, mentre *Ramon* con il suo *6.5* resta seduto. Si salva solo *Maignan* con un *7*. La Longobarda invece trova i cambi giusti: *Douglas Luiz* da *11* e *Bijlow* da *8* entrano al posto degli assenti, e il reparto difensivo porta tre punti di bonus. _Quattro vittorie di fortuna, una sconfitta vera. Lo Sfigometro aveva avvisato._\n\n🔵 UN PUNTO, E GLI SVENTRAPAPERE SONO PRIMI\nSporting Heroes 3 - 4 Sventrapapere (74 - 75)\n\nLa partita più tirata della giornata si decide per un punto. Gli Sventrapapere la vincono con *McTominay* da *13.5* e *De Ketelaere* da *8*, e la difesa interista che stavolta tiene senza strafare. Gli Sporting Heroes giocano bene: *Pulisic* da *10*, *Politano* e *Simeone* da *8*, ma in porta *Meret* chiude a *3.5*. Senza *Gila* e *Valle*, dalla panchina entrano *Di Lorenzo* e *Badiashile* da *6.5*. Per il resto si veda alla voce Caso. _Ancora zero vittorie per gli Sporting Heroes, e stavolta è mancato un punto._\n\n⚫ KRSTOVIC GIOCA, E VALE QUINDICI E MEZZO\nSan Scrosoppi 3 - 5 Fc Presidente (73 - 79)\n\nTre settimane fa *Krstovic* faceva *15* in panchina, adesso è titolare fisso e risponde con un *15.5*, il voto più alto della giornata. Con il *10.5* di *Thuram* bastano a fare *79* e cinque gol. San Scrosoppi gioca la sua miglior partita da settimane, *Vlasic* da *10.5* e *Soulè* da *10*, ma *Milinkovic-Savic* resta di nuovo senza voto e al suo posto entra ancora *Caprile*: stavolta da *4*. _Krstovic in campo vale una vittoria. In panchina valeva una sconfitta._\n\n⚪ DOUVIKAS E CALÒ, MISRAT SI ABITUA ALLE GOLEADE\nMisrat 5 - 2 BAM (80.5 - 69)\n\nSeconda goleada di fila per Misrat, ancora sopra quota *80*. *Douvikas* fa *13.5*, *Varela G.* stavolta titolare risponde con un *10*, e dalla panchina entra di nuovo *Calò* con un *10.5*. C'è anche *Gatti* da *8*, e c'è da dimenticare *Carnesecchi* da *2*. I BAM si aggrappano a *McKennie* da *10*, ma davanti *Raimondo*, *Ramos G.* e *Kolo Muani* restano tra il *5* e il *5.5*. _Misrat ha il miglior totale della lega, 378.5, e finalmente se ne accorge anche la classifica._\n\n📉 IL CASO · IL PORTIERE IN PANCHINA\n\nGli Sporting Heroes perdono *3 - 4* per un punto, *74* a *75*. In porta *Meret* fa *3.5*, in panchina *Skorupski* fa *7*. Con lui arrivavano a *77.5*: quattro gol, *4 - 4*, e niente primo posto per gli Sventrapapere.\n\n_Tre punti e mezzo lasciati in panchina, e un pareggio che diventa sconfitta._\n\n🎲 LO SFIGOMETRO · Dopo cinque giornate il più sfortunato sono gli *Sporting Heroes*, con *4.9 punti* rubati dal calendario: sarebbero quinti invece che penultimi. *Misrat* segue a *-4.1* e con i punti meritati sarebbe primo. Il più fortunato resta il *Red Hot Buj*, a *+4.7*. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *Krstovic* _(15.5)_\n😴 FLOP · *Carnesecchi* _(2)_\n⚔️ LA SFIDA · _Sventrapapere e Buj a 12: mercoledì si rigioca subito, turno infrasettimanale_", "editoriale": {"titolo": "📢 Arieccoli… Sciacquatevi la bocca (e gli occhi)", "firma": "Il Mazzulaturo", "testo": "Carissimi Fantafessi,\nse c'è una costante cosmica che attraversa gli anni in questa lega, al di là del vincere, perdere o pareggiare (concetti che fanno parte del gioco e che, per la legge dei grandi numeri, prima o poi si distribuiscono equamente tra tutti), è solo una: gli *Sventrapapere* occupano stabilmente le posizioni di testa. Al netto della sfiga, dei trend o delle formazioni dell'ultimo minuto.\nQuesto successo \"perpetuo\" non nasce mica il venerdì pomeriggio, a ridosso della consegna, cercando disperatamente di schierare l'undici meno peggio. No, signori. Questa è la derivata prima (per i meno colti: la conseguenza diretta) della pura genialità espressa durante l'asta del mercato.\nE mentre, puntuali come ogni anno, i soliti noti tornano a piangere dopo appena qualche giornata, coprendo le proprie imbarazzanti e ingiustificabili deficienze tecniche dietro a scuse paranormali (la sfiga, i tabù, le bambole voodoo e gli astri avversi), noi ce la ridiamo. Forti della nostra manifesta superiorità cerebrale, tattica e spirituale... sventriamo. E basta.\nE allora, carissimi e amatissimi Fantasfigati... muti e riga dritto.\n*SALUTATE LA CAPOLISTA!!!* 🚀🏆🥇", "replica": {"etichetta": "📰 Dalla rassegna stampa · la versione della redazione", "titolo": "Bollettino dal fronte, quinta giornata.", "testo": "Lunedì, ore 08.00: la bandiera degli Sventrapapere sventola sulla vetta. Dodici punti, primi per totale, e il Buj che guarda dal basso dopo un 0 - 4 che non si era mai visto. Lo avevo scritto: la vetta era in affitto. Il contratto è scaduto.\nFronte occidentale: i Los Pollos ci hanno provato. 74 a 75, un punto. Il loro portiere ha fatto 3.5, quello in panchina 7. Non aggiungo altro, la strategia militare la insegnano a scuola.\nFronte orientale: Misrat fa 80 per la seconda settimana di fila e scopre che vincere aiuta la classifica. Benvenuto, ci si abitua in fretta.\nRetrovie: i BAM e i Los Pollos a due punti, a contare le razioni. San Scrosoppi cerca ancora un portiere che prenda il voto.\nMercoledì si torna in trincea. Io sono già al mio posto. Fermo, impettito, con l'elmetto in testa.", "firma": "La redazione, a nome del Mazzulaturo"}}, "foto_copertina": "img/n7_foto_copertina_36ea14f5.jpg", "foto_partite": {"red_hot_buj|longobarda": "img/n7_foto0_8417f9be.jpg", "sporting_heroes|sventrapapere": "img/n7_foto1_e571bef9.jpg", "misrat|bam": "img/n7_foto2_6e049d25.jpg", "san_scrosoppi|fc_presidente": "img/n7_foto3_fa799748.jpg"}}, {"num": 8, "tipo": "post", "data": "30 ottobre 2026", "titolo": "FINALMENTE! LA PRIMA VITTORIA DEGLI SPORTING HEROES", "sommario": "Gli Sporting Heroes battono 5 - 0 il Presidente e vincono per la prima volta. In testa Sventrapapere e Buj ancora a 15, Sventrapapere - Misrat finisce 7 - 5", "punti": ["Sporting Heroes 5 - 0: prima vittoria della stagione", "Sventrapapere e Buj a 15, decide il totale", "Sventrapapere 7 - 5 Misrat: dodici gol e 86 punti", "Hojlund si sveglia, la Longobarda sale a 13"], "cover": "img/n8_cover_080ac108.jpg", "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 8 · 6ª Giornata · Stagione 2026 / 2027\n\n📊 FINALMENTE! LA PRIMA VITTORIA DEGLI SPORTING HEROES\n\nCinque giornate senza vittorie, tre sconfitte, due pareggi e lo Sfigometro sempre contro. Poi il turno infrasettimanale, e gli *Sporting Heroes* rifilano un *5 - 0* al Presidente con *80.5 punti*: prima vittoria della stagione, e i BAM restano soli in fondo. In testa non cambia niente: *Sventrapapere* e *Red Hot Buj* vincono entrambi e restano appaiati a *15*, con gli Sventrapapere davanti per il totale. La *S.S. Longobarda* batte San Scrosoppi e resta a due punti, Misrat fa *80* e perde ancora. _Il gallo ha cantato. Ci ha messo sei settimane, ma ha cantato._\n\n🔴 LA PRIMA VOLTA NON SI SCORDA MAI\nSporting Heroes 5 - 0 Fc Presidente (80.5 - 64.5)\n\nGli Sporting Heroes partono senza portiere, *Meret* senza voto e dentro *De Gea* da *4.5*, ma il resto della squadra non sbaglia quasi niente. *Lulli* fa *11.5*, *Politano* *10.5*, *De Bruyne* e *Malen* *10*: quattro titolari in doppia cifra e cinque gol. L'unico neo è *Frattesi* da *3*, con *Baldanzi* da *11.5* seduto in panchina. Il Presidente invece si spegne: *Muric* e *Adzic* senza voto, *Cambiaso* da *4*, e solo il *9.5* di *Zaccagni* a salvare la faccia. *64.5*, nessun gol. _La sfiga non è finita. Ha solo preso un calcio._\n\n🔵 DODICI GOL, E GLI SVENTRAPAPERE RESTANO PRIMI\nSventrapapere 7 - 5 Misrat (86 - 80)\n\nLa partita più pazza della stagione finisce *7 - 5*. Gli Sventrapapere fanno *86*, il secondo punteggio più alto dell'anno dopo l'*88* del Presidente alla prima giornata: *Cissè A.* da *13.5*, *Isaksen* da *12*, *De Ketelaere* da *11.5* e *Provedel* da *8*. Misrat risponde con *Calò* da *10.5* e tre *10*, *Baturina*, *Kvernadze* e *Varela G.*, e arriva a *80*. Basta per fare cinque gol, non per pareggiare. _Misrat supera quota 80 per la terza volta di fila, e stavolta non basta. Lo Sfigometro ringrazia._\n\n⚫ TRE GOL, E IL BUJ TIENE IL PASSO\nBAM 1 - 3 Red Hot Buj (68 - 74.5)\n\nIl Buj vince con *Maignan* da *2*, e già questo dice molto della stagione. A sistemare tutto ci pensano *Mora* da *10.5*, *Monteiro J.* e *Ramon* da *9.5*, mentre *Spence* resta senza voto e al suo posto entra *Vojvoda* da *6*. I BAM trovano *Paz N.* da *11.5* e *Raimondo* da *10*, ma il resto della squadra non supera il *6*, e restano a *2 punti* da soli in fondo. Per il resto si veda alla voce Caso. _Il Buj vince ancora senza convincere. Lo Sfigometro prende appunti._\n\n⚪ HOJLUND SI SVEGLIA, LA LONGOBARDA PURE\nS.S. Longobarda 3 - 2 San Scrosoppi (74.5 - 70.5)\n\n*Hojlund* fa *10*, il primo voto pieno della stagione per i *272 crediti* più cari della Longobarda. Con *Martinez Jo.* e *Lucca* senza voto entrano *Bijlow* da *7.5* ed *Esposito Se.* da *10*, e la partita è chiusa. San Scrosoppi gioca una buona partita, *Floriani Mussolini* da *10* e *Odgaard* da *7.5*, ma si ferma a *70.5*: un punto e mezzo sotto il terzo gol e il pareggio. _La Longobarda resta a due punti dalla vetta. San Scrosoppi resta a un passo da tutto._\n\n📉 IL CASO · IL PORTIERE GIUSTO IN PANCHINA\n\nI BAM perdono *1 - 3* con *68 punti*. In porta *Mandas* fa *4*, in panchina *Okoye* fa *10.5*. Con lui la squadra arrivava a *74.5*, cioè *3 gol*, e pareggiava *3 - 3* con il Buj.\n\n_Sei punti e mezzo lasciati in panchina, e un punto che ai BAM avrebbe fatto comodo._\n\n🎲 LO SFIGOMETRO · Dopo sei giornate *Misrat* torna il più sfortunato, con *6.4 punti* rubati dal calendario: con quelli sarebbe primo, e invece è quarto. Il più fortunato resta il *Red Hot Buj*, *+6.3*. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *Cissè A.* _(13.5)_\n😴 FLOP · *Maignan* _(2, e il Buj vince lo stesso)_\n⚔️ LA SFIDA · _Sventrapapere e Buj ancora a 15, la Longobarda a 13: in vetta si corre in tre_", "editoriale": {"titolo": "Occhio ai Balcani !!! 👁️", "firma": "Il Mazzulaturo", "testo": "Cari (ma neanche tanto) fantastasfigati, ben ritrovati.\nAvevo detto che per giudicare la lega ci sarebbero volute almeno 10 giornate, ma mi sento di dire che ad oggi, la squadra più in forma è sicuramente quella transadriatica: stessi goal fatti degli *Sventra*, ma il doppio dei goal subiti. Questo significa che hanno incontrato le avversarie nel loro momento migliore, insomma, è questa la squadra da battere.\nGli *Sventra* come da tre anni a questa parte non sono più una sorpresa; hanno dovuto fare 86 punti per spuntarla e adesso è chiaro a tutti che questi:\n*“Non vendono sogni, ma solide realtà !!!”*\n*Lo Pollos* raccolgono le briciole, *Buj* spercula, e le altre sono ancora in una zona di limbo, come cellule staminali che devono ancora decidere se diventare parte del tessuto testicolare o del buco del Q.\n*AD MAIORA !*", "replica": {"etichetta": "📰 Dalla rassegna stampa · la versione della redazione", "titolo": "Le pagelle del Mazzulaturo, sesta giornata.", "testo": "*Sventrapapere · voto 9.* Ottantasei punti, sette gol, ancora primi. Cissè, Isaksen e De Ketelaere fanno quello che devono fare i centrocampisti e gli attaccanti di una capolista: segnare. La difesa ha concesso cinque gol? Dettagli. Le difese servono a vincere i campionati, ma una volta ogni tanto si può anche vincere 7 - 5 per far divertire il pubblico.\n*Misrat · voto 7.* Fai 80, segni cinque gol e perdi. Hai incontrato la squadra sbagliata nel giorno sbagliato. Succede a tutti, a noi un po' meno.\n*Red Hot Buj · voto 5.* Vinci con il portiere da 2. Se il calendario fosse una persona, a Natale gli dovresti un regalo importante.\n*Sporting Heroes · voto 6 politico.* Prima vittoria dopo cinque giornate, e va bene, applausi. Ma il calcio allo Sfigometro non vale come titolo: il campionato è ancora lungo, e la vetta è a dieci punti.\n*BAM · voto 4.* Il portiere da 10.5 in panchina. Non serve aggiungere altro.\n*Longobarda · voto 6.5.* Hojlund si è ricordato di essere costato 272 crediti. Meglio tardi che mai.\nLa prossima volta voglio vedere la classifica con un nome solo in cima. Indovinate quale.", "firma": "La redazione, a nome del Mazzulaturo"}}, "foto_copertina": "img/n8_foto_copertina_0633019c.jpg", "foto_partite": {"sporting_heroes|fc_presidente": "img/n8_foto0_c32159da.jpg", "sventrapapere|misrat": "img/n8_foto1_ec8295b2.jpg", "bam|red_hot_buj": "img/n8_foto2_b4609443.jpg", "longobarda|san_scrosoppi": "img/n8_foto3_6da74819.jpg"}, "zone": [{"k": "copertina", "x": 3.89, "y": 24.21, "w": 92.22, "h": 34.2}, {"k": "copertina", "x": 3.89, "y": 81.65, "w": 21.76, "h": 9.91}, {"k": "sventrapapere|misrat", "x": 27.31, "y": 81.65, "w": 21.76, "h": 9.91}, {"k": "bam|red_hot_buj", "x": 50.74, "y": 81.65, "w": 21.76, "h": 9.91}, {"k": "longobarda|san_scrosoppi", "x": 74.17, "y": 81.65, "w": 21.76, "h": 9.91}]}, {"num": 9, "tipo": "post", "data": "3 novembre 2026", "titolo": "SCONTRO DIRETTO, IL BUJ SI PRENDE LA VETTA", "sommario": "Il Buj batte 7 - 4 gli Sventrapapere e torna solo in testa a 18. Laurientè 14, Misrat e Sporting Heroes 5 - 5 per mezzo punto", "punti": ["Red Hot Buj 7 - 4 Sventrapapere: il Buj è solo in testa a 18", "84.5 punti, terzo punteggio più alto della stagione", "Laurientè 14, San Scrosoppi supera gli Sporting Heroes", "BAM ultimi e unici ancora senza vittorie"], "cover": "img/n9_cover_af7d162b.jpg", "zone": [{"k": "copertina", "x": 3.89, "y": 20.86, "w": 92.22, "h": 35.39}, {"k": "sez:SPECIALE · LA MALEDIZIONE DI MISRAT", "x": 68.7, "y": 69.33, "w": 27.41, "h": 10.52}, {"k": "copertina", "x": 3.89, "y": 84.54, "w": 21.76, "h": 8.35}, {"k": "misrat|sporting_heroes", "x": 27.31, "y": 84.54, "w": 21.76, "h": 8.35}, {"k": "san_scrosoppi|bam", "x": 50.74, "y": 84.54, "w": 21.76, "h": 8.35}, {"k": "fc_presidente|longobarda", "x": 74.17, "y": 84.54, "w": 21.76, "h": 8.35}], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 9 · 7ª Giornata · Stagione 2026 / 2027\n\n📊 SCONTRO DIRETTO, IL BUJ SI PRENDE LA VETTA\n\nLa giornata aveva una sola partita da guardare, e il *Red Hot Buj* l'ha vinta senza discussioni: *7 - 4* agli *Sventrapapere* con *84.5 punti*, il terzo punteggio più alto della stagione. Il Buj torna da solo in testa a *18*, gli Sventrapapere scendono a *15* e la *S.S. Longobarda* pareggia con il Presidente e sale a *14*. Più giù Misrat e Sporting Heroes si dividono dieci gol, San Scrosoppi batte i BAM e li lascia soli in fondo, ancora senza vittorie. _Stavolta il calendario non c'entra: il Buj la vetta se l'è presa sul campo._\n\n🔴 SETTE GOL ALLA CAPOLISTA\nRed Hot Buj 7 - 4 Sventrapapere (84.5 - 75)\n\nIl Buj gioca la partita migliore della sua stagione proprio nella sfida che conta. *Moreira* fa *12*, *Da Cunha* e *Mora* *10*, *Pinamonti* *9.5*, e la difesa con *Pavlovic* da *7* porta due punti di modificatore. Nessun cambio, nessun senza voto: undici in campo e undici voti. Gli Sventrapapere invece partono senza *Cissè A.* e *Bonny*, e dalla panchina *Cristante* risponde con un *11.5*. Con *Isaksen* da *10.5* e *Bastoni* da *9.5* arrivano a *75*, ma *Carlos Augusto* da *4* pesa più del previsto. _Quattro gol sono tanti, sette sono troppi._\n\n🔵 DIECI GOL E MEZZO PUNTO\nMisrat 5 - 5 Sporting Heroes (79.5 - 79)\n\nFinisce in parità per mezzo punto, con cinque gol per parte. Misrat si affida ancora a *Calò* da *10.5*, a *Rabiot* e *Varela G.* da *10* e a *Kvernadze* da *8*, ma in porta *Carnesecchi* chiude a *2.5*. Gli Sporting Heroes stavolta schierano il portiere giusto, *Skorupski* da *9*, con *Pulisic* e *Malen* da *10*. Senza *Dimarco* e *Lulli* entrano *Hermoso* e *Gila*, mentre *Alajbegovic* resta seduto con un *10*. _Misrat gira intorno a quota 80 da quattro giornate: miglior totale della lega, 538, e quarto posto._\n\n⚫ LAURIENTÈ DA QUATTORDICI, SAN SCROSOPPI RIALZA LA TESTA\nSan Scrosoppi 3 - 0 BAM (74.5 - 64.5)\n\n*Laurientè* fa *14*, il voto più alto della giornata, *Soulè* lo accompagna con un *9* e *Modric* aggiunge un *7*. San Scrosoppi resta ancora senza il portiere titolare, *Milinkovic-Savic* senza voto e dentro *Caprile* da *4.5*, ma stavolta basta lo stesso: seconda vittoria e sorpasso sugli Sporting Heroes. I BAM si fermano a *64.5* e non segnano. In campo il migliore è *Wesley* da *7.5*, in panchina invece restano *Vicario* da *7.5* e *Boga* da *10*. _Sette giornate, zero vittorie: i BAM sono gli unici a non aver ancora festeggiato._\n\n⚪ UN PUNTO A TESTA E UN PORTIERE DA 3\nFc Presidente 2 - 2 S.S. Longobarda (69 - 70)\n\nIl Presidente trova *Mastantuono* da *10* e *Pellegrino M.* da *10* entrato dalla panchina, ma resta senza *Mancini* e *Romero D.*. La Longobarda risponde con *N'Dicka* da *9.5*, *Castro S.* ed *Esposito Se.* da *7.5*, e un punto di modificatore. In porta però *Martinez Jo.* fa *3*, con *Bijlow* da *5.5* in panchina insieme a *Goncalves P.* da *8*. Per il resto si veda alla voce Caso. _La Longobarda sale a 14, a quattro punti dalla vetta._\n\n📉 IL CASO · L'ORDINE DELLA PANCHINA\n\nIl Presidente pareggia *2 - 2* con *69 punti*. *Mancini* resta senza voto e al suo posto entra il primo difensore in panchina, *Zappacosta*, che fa *2.5*. Subito dietro c'erano *Coco* e *Cambiaso* da *6.5*: con uno dei due la squadra arrivava a *73*, cioè *3 gol*, e vinceva *3 - 2*.\n\n_Quattro punti persi nell'ordine della panchina, e due punti in classifica._\n\n🕯️ SPECIALE · LA MALEDIZIONE DI MISRAT\n\nSette giornate, *538 punti*: il miglior totale della lega. *29 gol* fatti, più di tutti. Quattro volte su sette tra i due punteggi più alti della giornata. Eppure Misrat è quarto, con *8 punti* e appena due vittorie. I due punteggi più alti della stagione, l'*88* del Presidente alla prima e l'*86* degli Sventrapapere alla sesta, sono arrivati proprio contro di lui. Ha perso facendo *76* e *80*, ha pareggiato per mezzo punto con San Scrosoppi e di nuovo, ieri, con gli Sporting Heroes. E il dato più crudele: i suoi avversari in sette giornate hanno fatto *539.5 punti*, uno e mezzo più di lui. Nessuno ha incontrato avversari così in forma. Lo Sfigometro gli toglie *7.7 punti*: con quelli meritati, *15.7*, sarebbe primo in classifica con quasi il doppio dei punti che ha.\n\n_Se la sfiga fosse una squadra, giocherebbe sempre contro Misrat._\n\n🎲 LO SFIGOMETRO · Il più sfortunato è Misrat, e ormai non fa più notizia. Il più fortunato resta il *Red Hot Buj* a *+6.3*, ma la vittoria di ieri se l'è meritata tutta. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *Laurientè* _(14)_\n😴 FLOP · *Carnesecchi* _(2.5, e Misrat non vince)_\n⚔️ LA SFIDA · _Red Hot Buj a 18, Sventrapapere a 15, Longobarda a 14: il Buj ora ha un margine da difendere_", "editoriale": {"titolo": "Comunicato ufficiale della società.", "testo": "La società Sventrapapere comunica di aver perso una partita. Ripetiamo: una. Su sette. Si informano i signori tifosi avversari che non serve esultare così, i caroselli in centro sono vietati dal regolamento comunale.\nSi precisa inoltre che lo stesso Buj, dopo essere stato aiutato dal calendario per un mese e mezzo, ha avuto bisogno di 84.5 punti e del suo miglior centrocampo di sempre per batterci. Ottantaquattro e mezzo. Lo scriviamo due volte perché resti agli atti.\nLa società prende atto della prestazione di Carlos Augusto, voto 4, e lo convoca per un colloquio chiarificatore. Bastoni, 9.5, resta il capitano morale della difesa nerazzurra.\nPer tutti gli altri: la classifica dice tre punti. Tre punti, in un campionato ancora lunghissimo, sono una pausa caffè.\nIl Mazzulaturo non rilascerà altre dichiarazioni. Domenica parcheggia e fa il risultato, come sempre.", "firma": "Il Mazzulaturo"}, "foto_copertina": "img/n9_foto_copertina_9702f8ff.jpg", "foto_partite": {"red_hot_buj|sventrapapere": "img/n9_foto0_aedcbd95.jpg", "misrat|sporting_heroes": "img/n9_foto1_9bf40424.jpg", "san_scrosoppi|bam": "img/n9_foto2_7568e279.jpg", "fc_presidente|longobarda": "img/n9_foto3_3f10f3a4.jpg", "sez:SPECIALE · LA MALEDIZIONE DI MISRAT": "img/n9_foto4_b7ddb372.jpg"}}, {"num": 10, "tipo": "post", "data": "9 novembre 2026", "titolo": "IL MONDO ALLA ROVESCIA", "sommario": "Perdono le prime quattro, vincono le ultime quattro. I BAM trovano la prima vittoria, il Buj ne prende sei ma resta in testa", "punti": ["Le prime quattro perdono, le ultime quattro vincono", "BAM, prima vittoria all'ottava giornata", "Red Hot Buj 1 - 6 Sporting Heroes: la capolista resta capolista", "Il Presidente sale al quarto posto"], "cover": "img/n10_cover_616a681d.jpg", "zone": [{"k": "copertina", "x": 3.89, "y": 26.31, "w": 92.22, "h": 36.64}, {"k": "red_hot_buj|sporting_heroes", "x": 3.89, "y": 84.0, "w": 21.76, "h": 8.65}, {"k": "longobarda|bam", "x": 27.31, "y": 84.0, "w": 21.76, "h": 8.65}, {"k": "fc_presidente|misrat", "x": 50.74, "y": 84.0, "w": 21.76, "h": 8.65}, {"k": "san_scrosoppi|sventrapapere", "x": 74.17, "y": 84.0, "w": 21.76, "h": 8.65}], "testo": "📰 LA GAZZETTA DELLA LEGA COZZE E VONGOLE\nNumero 10 · 8ª Giornata · Stagione 2026 / 2027\n\n📊 IL MONDO ALLA ROVESCIA\n\nLe prime quattro perdono tutte, le ultime quattro vincono tutte. Non era mai successo, e succede proprio la settimana in cui i *BAM* trovano la prima vittoria della stagione: *3 - 1* sul campo della Longobarda, all'ottavo tentativo. Il *Red Hot Buj* incassa un *1 - 6* dagli *Sporting Heroes*, ma resta in testa a *18* perché anche *Sventrapapere* e *S.S. Longobarda* si fermano. Dietro si accorcia tutto: il Presidente sale quarto a *11*, a tre punti dalla Longobarda, e Misrat scivola al settimo, sempre con il miglior totale della lega. _In vetta non cambia niente. Sotto, cambia tutto._\n\n🔴 DAL SETTE AL SEI, MA DALL'ALTRA PARTE\nRed Hot Buj 1 - 6 Sporting Heroes (68 - 82)\n\nUna settimana fa il Buj ne faceva sette alla capolista, stavolta ne prende sei. Gli *Sporting Heroes* fanno *82 punti*, il quarto punteggio più alto della stagione: *Hermoso* da *10.5*, da difensore, *Frattesi* da *10*, lo stesso Frattesi che due giornate fa aveva fatto *3*, e *Pulisic* da *9.5*. La difesa porta *2.5* punti di modificatore, e la terza partita di fila senza sconfitte. Il Buj si aggrappa a *Mora* da *10* e a poco altro. Senza *Pavlovic* entra *Vojvoda* da *5.5*, mentre in panchina restano *Spence* da *8* e *Solet* da *6.5*: con Spence sarebbe finita 2 - 6, non cambiava niente. _La sconfitta più pesante della stagione per la capolista. Che resta capolista._\n\n🔵 I BAM HANNO VINTO. RIPETIAMO: I BAM HANNO VINTO\nS.S. Longobarda 1 - 3 BAM (68 - 74)\n\nSette giornate senza vittorie, due pareggi e cinque sconfitte. All'ottava, in trasferta contro la terza in classifica, arriva il primo successo. *Orsolini* fa *10*, *Ramos G.* e *Kolo Muani* *7.5*, *Comuzzo* *7*, e la difesa aggiunge due punti di modificatore. In porta *Vicario* fa *4.5* con *Mandas* da *6* in panchina: il portiere sbagliato in campo, ma per una volta va bene lo stesso. La Longobarda trova *Bremer* da *8.5* e *Martinez Jo.* da *7*, dopo il *3* della settimana scorsa, ma davanti *Hojlund* e *Lucca* si fermano a *5.5*. Per il resto si veda alla voce Caso. _I BAM restano ultimi, ma adesso sanno come si fa._\n\n⚫ TRENTA PUNTI IN TRE, IL PRESIDENTE SALE AL QUARTO POSTO\nFc Presidente 3 - 1 Misrat (74.5 - 67.5)\n\nIl tridente del Presidente fa *30.5 punti*: *Thuram* *10.5*, *Pellegrino M.* e *Krstovic* *10*. Basta e avanza, anche con *Vasquez* da *4.5*. *Mancini* resta di nuovo senza voto e dalla panchina entra di nuovo *Zappacosta*: la settimana scorsa aveva fatto *2.5*, stavolta *6*. Misrat ritrova *Carnesecchi*, *8* dopo il *2.5*, ma perde l'attacco: *Kvernadze* *5*, *Varela G.* *5.5*, e tra i giocatori di movimento il migliore è *Rabiot* da *7*. *67.5 punti*, il punteggio più basso della sua stagione. _Stavolta la sfiga non c'entra. Ma Misrat è settimo con il miglior totale della lega, e questo resta un mistero._\n\n⚪ WOLTEMADE ED ESPOSITO, SAN SCROSOPPI NE VINCE DUE DI FILA\nSan Scrosoppi 3 - 2 Sventrapapere (74 - 69)\n\n*Woltemade* ed *Esposito F.P.* fanno *9.5* a testa, *Odgaard* aggiunge un *7*, e San Scrosoppi vince la seconda partita consecutiva e sale a *10*. In porta *Milinkovic-Savic* fa *5.5* e in panchina *Caprile* fa *8.5*: la settimana scorsa era toccato a Caprile, entrato con *4.5*. Gli Sventrapapere perdono la seconda di fila e restano senza portieri: *Provedel* e *Butez* senza voto, entra *Sanchez Ro.* da *4*. *Cissè A.* fa *10*, *Bastoni* *7*, ma davanti nessuno supera il *6*. _Lo Sventrapapere perde ancora, il Buj pure: il distacco resta di tre punti._\n\n📉 IL CASO · IL DIECI E MEZZO IN PANCHINA\n\nLa Longobarda perde *1 - 3* con *68 punti*. A centrocampo *Calhanoglu* ed *Ekkelenkamp* fanno *6*, in panchina *Perez K.* fa *10.5*. Con lui al posto di uno dei due la squadra arrivava a *72.5*, cioè *3 gol*, e pareggiava *3 - 3*.\n\n_Quattro punti e mezzo lasciati in panchina, e i BAM avrebbero dovuto aspettare ancora._\n\n🎲 LO SFIGOMETRO · *Misrat* tocca il record: *8 punti* rubati, settimo in classifica e primo in quella dei meritati. I suoi avversari hanno fatto *614 punti* in otto giornate, più di chiunque altro. Il più fortunato resta il *Red Hot Buj* a *+6*, nonostante i sei gol presi. Lo trovi in fondo alla pagina Classifiche.\n\n🏆 MVP · *Hermoso* _(10.5, da difensore)_\n😴 FLOP · *Sanchez Ro.* _(4, entrato con due portieri senza voto)_\n⚔️ LA SFIDA · _Red Hot Buj 18, Sventrapapere 15, Longobarda 14, poi il vuoto: il Presidente è quarto a 11_", "editoriale": {"titolo": "Sei. Ho detto sei.", "testo": "Abbiamo perso, lo sappiamo. Senza due portieri su due, con Sanchez in porta da 4, a San Scrosoppi. Succede. Prendiamo atto, chiediamo scusa ai tifosi e voltiamo pagina.\nPerò, signori, scusate se mi distraggo un attimo. Il Red Hot Buj, la capolista, quello che una settimana fa festeggiava come avesse vinto lo scudetto, ne ha presi sei. Sei. Dagli Sporting Heroes. Quelli che fino a un mese fa non sapevano cosa fosse una vittoria.\nMi dicono che in sede del Buj stiano ancora cercando Pavlovic. Mi dicono anche che Spence, da 8, abbia passato la giornata in panchina a guardare. Non commento, non è il mio stile.\nIl distacco resta di tre punti. Tre punti, ve l'ho già detto, sono una pausa caffè. Ma adesso il caffè lo prendiamo con calma, perché il Buj ha capito che si può perdere anche lui.\nAi BAM, sinceramente, i complimenti per la prima vittoria. Era ora. Alla Longobarda invece niente: perdere con i BAM e Perez da 10.5 in panchina è una cosa che resta.\nIl Mazzulaturo si ferma per la sosta. Poi torna, parcheggia e fa il risultato.", "firma": "Il Mazzulaturo"}, "foto_copertina": "img/n10_foto_copertina_ed4d16a9.jpg", "foto_partite": {"red_hot_buj|sporting_heroes": "img/n10_foto0_6bce2a1c.jpg", "longobarda|bam": "img/n10_foto1_4368de1c.jpg", "fc_presidente|misrat": "img/n10_foto2_29e0f19b.jpg", "san_scrosoppi|sventrapapere": "img/n10_foto3_f35b87ae.jpg"}}]};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const SQ = LEGA.squadre;
const nomeSq = k => SQ[k] ? SQ[k].nome : k;

/* ---------- calcoli ---------- */
function classifica(){
  const t = {};
  Object.keys(SQ).forEach(k => t[k] = {k, g:0, v:0, n:0, p:0, gf:0, gs:0, pt:0, tot:0});
  LEGA.giornate.forEach(gio => gio.partite.forEach(p => {
    const a = t[p.c], b = t[p.t];
    a.g++; b.g++;
    a.gf += p.gc; a.gs += p.gt; b.gf += p.gt; b.gs += p.gc;
    a.tot += p.pc; b.tot += p.pt;
    if (p.gc > p.gt){ a.v++; b.p++; a.pt += 3; }
    else if (p.gc < p.gt){ b.v++; a.p++; b.pt += 3; }
    else { a.n++; b.n++; a.pt++; b.pt++; }
  }));
  return Object.values(t).sort((x,y) =>
    y.pt - x.pt || y.tot - x.tot || (y.gf - y.gs) - (x.gf - x.gs));
}
function golDa(p){ return p < 66 ? 0 : 1 + Math.floor((p - 66) / 3); }
function mancava(p){ const s = p < 66 ? 66 : 66 + 3 * (Math.floor((p - 66) / 3) + 1); return +(s - p).toFixed(1); }
function prestazioni(){
  const r = [];
  LEGA.giornate.forEach(g => g.partite.forEach(p => {
    r.push({sq:p.c, punti:p.pc, n:g.n});
    r.push({sq:p.t, punti:p.pt, n:g.n});
  }));
  return r;
}

/* ---------- viste ---------- */
function vistaPrima(){
  const u = LEGA.uscite.slice().sort((a,b) => b.num - a.num)[0];
  const cl = classifica();
  $("sec-prima").innerHTML = `
    <div class="card">
      <span class="tag">${u.tipo === "S" ? "Numero speciale" : "Numero " + u.num}</span>
      <span class="pill">${esc(u.data)}</span>
      <h3 style="margin-top:8px">${esc(u.titolo)}</h3>
      <p style="margin:4px 0 12px">${esc(u.sommario)}</p>
      ${copertina(u)}
      <ul class="punti">${u.punti.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <button class="apri" data-num="${u.num}">Leggi il numero</button>
    </div>
    <div class="card">
      <span class="tag giallo">Il prossimo turno</span>
      <h3 style="margin-top:8px">${LEGA.prossimo.giornata}ª di lega · ${LEGA.prossimo.serieA}ª di Serie A</h3>
      <p style="margin:2px 0 0;color:var(--tenue)">Si gioca nel ${esc(LEGA.prossimo.quando)}</p>
    </div>
    <h2>La vetta</h2>
    <table><thead><tr><th></th><th>Squadra</th><th class="r">Pt</th><th class="r">Totale</th></tr></thead>
    <tbody>${cl.slice(0,3).map((r,i) => `<tr${i?"":' class="primo"'}><td class="n">${i+1}</td>
      <td><img class="mini" src="${SQ[r.k].logo}">${esc(nomeSq(r.k))}</td>
      <td class="r">${r.pt}</td><td class="r">${r.tot}</td></tr>`).join("")}</tbody></table>`;
}

function vistaArchivio(){

  const blocco = (titolo, righe) => `<div class="card mini-cl"><h3>${titolo}</h3>` +

}

function sfigometro(){
  const reale = classifica();
  const posReale = {}; reale.forEach((r,i) => posReale[r.k] = i+1);
  const t = {}; Object.keys(SQ).forEach(k => t[k] = {k, mer:0, g:0, fortu:0, sfiga:0, filo:0, soffio:0, beffa:0, rubata:0, serie:[]});
  LEGA.giornate.forEach(g => {
    const pts = {}; g.partite.forEach(p => { pts[p.c] = p.pc; pts[p.t] = p.pt; });
    Object.keys(pts).forEach(k => {
      let w = 0, d = 0; const a = golDa(pts[k]);
      Object.keys(pts).forEach(k2 => { if (k2 === k) return; const b = golDa(pts[k2]); if (a > b) w++; else if (a === b) d++; });
      const m = (3*w + d) / (Object.keys(pts).length - 1);
      t[k].mer += m; t[k].g++;
      if (a > 0 && pts[k] - (66 + 3*(a-1)) <= 1.5) t[k].filo++;
      if (mancava(pts[k]) <= 1.5) t[k].soffio++;
    });
    g.partite.forEach(p => {
      const vc = p.gc > p.gt, vt = p.gt > p.gc;
      if (vt && p.pc > p.pt) { t[p.c].beffa++; t[p.t].rubata++; }
      if (vc && p.pt > p.pc) { t[p.t].beffa++; t[p.c].rubata++; }
    });
    Object.keys(pts).forEach(k => {
      const rr = reale.find(x => x.k === k);
      t[k].serie.push(+(t[k].mer).toFixed(1));
    });
  });
  const righe = Object.values(t).map(o => {
    const rr = reale.find(x => x.k === o.k);
    return {...o, pt: rr.pt, mer:+o.mer.toFixed(1), diff:+(rr.pt - o.mer).toFixed(1)};
  }).sort((a,b) => b.mer - a.mer || b.pt - a.pt);
  const posMer = {}; righe.forEach((r,i) => posMer[r.k] = i+1);
  const salto = o => posMer[o.k] - posReale[o.k];
  const fort = righe.slice().sort((a,b) => b.diff - a.diff || salto(b) - salto(a))[0];
  const sfig = righe.slice().sort((a,b) => a.diff - b.diff || salto(a) - salto(b))[0];
  const giusto = righe.slice().sort((a,b) => Math.abs(a.diff) - Math.abs(b.diff) || Math.abs(salto(a)) - Math.abs(salto(b)) || b.pt - a.pt)[0];
  const segno = v => v > 0 ? `<span class="sfg-pos">+${v}</span>` : v < 0 ? `<span class="sfg-neg">${v}</span>` : `<span class="sfg-zero">0</span>`;
  const mossa = k => { const d = posReale[k] - posMer[k]; return d > 0 ? `<span class="sfg-pos">▲${d}</span>` : d < 0 ? `<span class="sfg-neg">▼${-d}</span>` : `<span class="sfg-zero">=</span>`; };
  const pr = (em, et, o, vl) => `<div class="pr"><div class="em">${em}</div><div class="et">${et}</div>
    <img src="${SQ[o.k].logo}" alt=""><div class="nm">${esc(SQ[o.k].breve)}</div><div class="vl">${vl}</div></div>`;
  const ep = (tit, campo, verso) => `<div class="card"><h3>${tit}</h3>` + righe.slice().sort((a,b) => verso*(b[campo]-a[campo]))
    .map(o => `<div class="r1"><img class="mini" src="${SQ[o.k].logo}" alt=""><span class="nm">${esc(SQ[o.k].breve)}</span><b>${o[campo]}</b></div>`).join("") + `</div>`;
  return `<div class="sfg-testa"><h2>Lo Sfigometro</h2>
    <div class="sotto">Se fosse andata come doveva andare</div>
    ${quadranteSfiga(sfig, fort)}
    <div class="ago">La lancetta segna il più sfortunato: <b>${esc(SQ[sfig.k].breve)}</b> a ${sfig.diff}</div></div>
    <div class="card" style="margin-bottom:12px"><p style="margin:0;color:var(--tenue);font-size:16px">
      E se il calendario non c'entrasse? Qui ogni squadra gioca contro tutte le altre sette, ogni giornata, con i gol delle soglie di sempre.
      Non è la classifica vera: è quella che dice quanto hai meritato. La differenza tra i punti veri e quelli meritati è lo sfigometro:
      sotto zero sei sfortunato, sopra zero ringrazia il calendario.</p></div>
    <div class="sfg-premi">
      ${pr("🍀", "Il più fortunato", fort, "+" + fort.diff + " punti regalati" + (salto(fort) > 0 ? ", " + salto(fort) + (salto(fort) === 1 ? " posto" : " posti") + " in più" : ""))}
      ${pr("🌧️", "Il più sfortunato", sfig, sfig.diff + " punti rubati" + (salto(sfig) < 0 ? ", " + (-salto(sfig)) + (salto(sfig) === -1 ? " posto" : " posti") + " in meno" : ""))}
      ${pr("⚖️", "Il più giusto", giusto, (giusto.diff > 0 ? "+" : "") + giusto.diff + ", fortuna quasi a zero")}
    </div>
    <div class="card" style="margin-bottom:12px">${graficoSfiga(righe)}</div>
    <h3 style="font-size:17px;margin:6px 2px 8px">Dal più fortunato al più sfortunato</h3>
    <table><thead><tr><th></th><th>Squadra</th><th class="r">Veri</th><th class="r">Meritati</th><th class="r">Sfigometro</th></tr></thead>
    <tbody>${righe.slice().sort((a,b) => b.diff - a.diff || b.mer - a.mer).map((o,i) => `<tr><td class="n">${i+1}</td>
      <td><img class="mini" src="${SQ[o.k].logo}">${esc(SQ[o.k].breve)} <span style="font-size:13px">${mossa(o.k)}</span></td>
      <td class="r">${o.pt}</td><td class="r"><b>${o.mer}</b></td><td class="r">${segno(o.diff)}</td></tr>`).join("")}</tbody></table>
    <p class="sfg-nota">La freccia accanto al nome dice di quante posizioni la squadra salirebbe o scenderebbe nella classifica meritata.</p>
    <p class="sfg-nota">Stime a scopo ricreativo: la classifica ufficiale resta quella dell'app, e le lamentele vanno al calendario.</p>`;
}

function quadranteSfiga(sfig, fort){
  const max = Math.max(1, Math.abs(sfig.diff), Math.abs(fort.diff));
  const W = 300, H = 186, cx = 150, cy = 150, R = 124, r = 84;
  const arc = (a0, a1, col) => {
    const p = a => [cx + R * Math.cos(a), cy - R * Math.sin(a)], q = a => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
    const [x0,y0] = p(a0), [x1,y1] = p(a1), [x2,y2] = q(a1), [x3,y3] = q(a0);
    return `<path d="M${x0},${y0} A${R},${R} 0 0 0 ${x1},${y1} L${x2},${y2} A${r},${r} 0 0 1 ${x3},${y3} Z" fill="${col}"/>`;
  };
  const seg = [["#C8003F",Math.PI,Math.PI*0.8],["#E8475F",Math.PI*0.8,Math.PI*0.6],["#F4B400",Math.PI*0.6,Math.PI*0.4],["#7FBF4D",Math.PI*0.4,Math.PI*0.2],["#1B7F3B",Math.PI*0.2,0]];
  const ang = Math.PI/2 + (sfig.diff / max) * (Math.PI/2) * -1;
  const nx = cx + (R - 16) * Math.cos(ang), ny = cy - (R - 16) * Math.sin(ang);
  return `<svg viewBox="0 0 ${W} ${H}" font-family="'Barlow Condensed',Arial,sans-serif">
    ${seg.map(([c,a0,a1]) => arc(a0, a1, c)).join("")}
    <text x="${cx-R+ (R-r)/2}" y="${cy+22}" font-size="12" fill="#ddd" font-weight="700" text-anchor="middle">SFIGA</text>
    <text x="${cx+R-(R-r)/2}" y="${cy+22}" font-size="12" fill="#ddd" font-weight="700" text-anchor="middle">FORTUNA</text>
    <text x="${cx}" y="22" font-size="11" fill="#bbb" text-anchor="middle">0</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="11" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="5" fill="#2B2B30"/>
    <image href="${SQ[sfig.k].logo}" x="${cx-22}" y="${cy-58}" width="44" height="44" clip-path="circle(22px at 22px 22px)"/>
  </svg>`;
}

function graficoSfiga(righe){
  const d = righe.slice().sort((a,b) => b.diff - a.diff);
  const max = Math.max(1, ...d.map(o => Math.abs(o.diff)));
  const W = 360, LAB = 118, rowH = 30, H = d.length * rowH + 30, x0 = LAB + 6, x1 = W - 6;
  const mid = x0 + (x1 - x0) * 0.45, half = Math.min(mid - x0, x1 - mid) - 30;
  const X = v => mid + (v / max) * half;
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:'Barlow Condensed',Arial,sans-serif">`;
  out += `<text x="${x0}" y="14" font-size="12" fill="var(--tenue)" text-anchor="start">SFORTUNA</text>`;
  out += `<text x="${x1}" y="14" font-size="12" fill="var(--tenue)" text-anchor="end">FORTUNA</text>`;
  out += `<line x1="${mid}" y1="22" x2="${mid}" y2="${H-4}" stroke="var(--testo)" stroke-width="1.5"/>`;
  d.forEach((o,i) => {
    const y = 26 + i * rowH, w = Math.abs(X(o.diff) - mid), xb = o.diff >= 0 ? mid : mid - w;
    const col = o.diff > 0 ? "#1B7F3B" : o.diff < 0 ? "var(--magenta)" : "var(--tenue)";
    out += `<text x="${LAB}" y="${y+16}" text-anchor="end" font-size="13" font-weight="600" fill="var(--testo)">${esc(SQ[o.k].breve)}</text>`;
    out += `<rect x="${xb}" y="${y+4}" width="${Math.max(2,w)}" height="18" rx="4" fill="${col}"/>`;
    const tx = o.diff >= 0 ? X(o.diff) + 5 : X(o.diff) - 5;
    out += `<text x="${tx}" y="${y+17}" font-size="13" font-weight="700" fill="${col}" text-anchor="${o.diff >= 0 ? "start" : "end"}">${o.diff > 0 ? "+" : ""}${o.diff}</text>`;
  });
  return out + `</svg>`;
}

function termometro(){
  const ultima = LEGA.giornate[LEGA.giornate.length - 1];
  const dati = [];
  ultima.partite.forEach(p => { dati.push({sq:p.c, punti:p.pc}); dati.push({sq:p.t, punti:p.pt}); });
  dati.sort((a,b) => b.punti - a.punti);
  const min = 55, max = Math.max(...dati.map(d => d.punti)) + 4;
  const W = 340, H = dati.length * 30 + 34, LAB = 116, x0 = LAB, x1 = W - 26;
  const X = v => x0 + (v - min) / (max - min) * (x1 - x0);
  let soglie = "";
  for (let v = 66, n = 1; v <= max; v += 3, n++){
    soglie += `<line x1="${X(v).toFixed(1)}" y1="26" x2="${X(v).toFixed(1)}" y2="${H-8}"
      stroke="var(--bordo)" stroke-dasharray="3 4"/>
      <text x="${X(v).toFixed(1)}" y="20" text-anchor="middle" font-size="11" fill="var(--tenue)">${n}</text>`;
  }
  const barre = dati.map((d,i) => {
    const y = 30 + i * 30, w = Math.max(3, X(d.punti) - x0);
    const vicino = mancava(d.punti) <= 1.5;
    return `<text x="${x0-8}" y="${y+13}" text-anchor="end" font-size="13" font-weight="600"
      fill="var(--testo)">${esc(SQ[d.sq].breve)}</text>
      <rect x="${x0}" y="${y}" width="${w.toFixed(1)}" height="19" rx="2"
      fill="${vicino ? "var(--magenta)" : "var(--blu)"}"/>
      <text x="${(x0+w+6).toFixed(1)}" y="${y+14}" font-size="12" font-weight="700" fill="var(--testo)">${d.punti}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Termometro delle soglie gol"
    style="display:block">${soglie}${barre}</svg>`;
}

const EMO = /^((?:[0-9#*]️?⃣)|(?:\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*))\s+(.*)$/u;
const PREMI = ["\u{1F3C6}", "\u{1F634}", "⚔", "\u{1F4B0}", "\u{1F4C9}"];

function senzaMark(s){ return String(s).replace(/[*_]/g, ""); }
function tuttoMaiusc(s){
  const t = senzaMark(s);
  return /[A-ZÀ-ÖØ-Þ]/.test(t) && t === t.toLocaleUpperCase("it");
}
function inline(s){
  return esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/_([^_\n]+)_/g, "<i>$1</i>");
}
function chiaveSq(nome){
  const n = senzaMark(nome).toLowerCase().replace(/[^a-zà-ù0-9 ]/g, "").replace(/\s+/g, " ").trim();
  if (!n) return null;
  let best = null, len = 0;
  Object.keys(SQ).forEach(k => {
    [SQ[k].nome, SQ[k].breve].forEach(v => {
      const c = v.toLowerCase().replace(/[^a-zà-ù0-9 ]/g, "").replace(/\s+/g, " ").trim();
      if ((n === c || n.indexOf(c) >= 0 || c.indexOf(n) >= 0) && c.length > len){ best = k; len = c.length; }
    });
  });
  return best;
}
function banda(a, b, gc, gt, pc, pt){
  const ka = chiaveSq(a), kb = chiaveSq(b);
  const lato = (k, f) => `<div class="lt">${k ? `<img src="${SQ[k].logo}" alt="">` : ""}
    <span>${esc(k ? SQ[k].breve : senzaMark(f))}</span></div>`;
  const ct = (gc === null)
    ? `<span class="vs">vs</span>`
    : `<span class="gol">${gc} - ${gt}</span>` + (pc === null ? "" : `<span class="fp">${pc} · ${pt}</span>`);
  return `<div class="banda">${lato(ka, a)}<div class="ct">${ct}</div>${lato(kb, b)}</div>`;
}

function articolo(testo, foto){
  foto = foto || {};
  const righe = String(testo).split("\n");
  let k = 0;
  if (righe[0] && righe[0].indexOf("\u{1F4F0}") === 0) k = 2;
  const out = [];
  let para = [], premi = [];
  const chiudiPara = () => {
    if (para.length){ out.push(`<p class="ap">${inline(para.join(" "))}</p>`); para = []; }
  };
  const chiudiPremi = () => {
    if (premi.length){ out.push(`<div class="premi">${premi.join("")}</div>`); premi = []; }
  };
  const R = /^(.+?)\s+(\d+)\s*-\s*(\d+)\s+(.+?)\s*\(\s*([\d.]+)\s*-\s*([\d.]+)\s*\)\s*$/;
  const V = /^(.{2,40}?)\s+vs\s+(.{2,40}?)\s*$/i;

  for (let n = k; n < righe.length; n++){
    const r = righe[n].trim();
    if (!r){ chiudiPara(); continue; }
    if (/^[━─-]{3,}$/.test(r)){ chiudiPara(); chiudiPremi(); out.push('<hr class="ah">'); continue; }

    const m = r.match(EMO);
    if (m){
      const em = m[1], resto = m[2].trim();
      if (PREMI.indexOf(em.replace(/️/g, "")) >= 0 && resto.indexOf("·") > 0 && !tuttoMaiusc(resto)){
        chiudiPara();
        const q = resto.split("·");
        premi.push(`<div class="premio"><span class="em">${em}</span><span>
          <span class="et">${esc(senzaMark(q.shift()).trim())}</span>
          <span class="vl">${inline(q.join("·").trim())}</span></span></div>`);
        continue;
      }
      chiudiPara(); chiudiPremi();
      if (tuttoMaiusc(resto)){
        out.push(`<div class="sez${/^SPECIALE/i.test(senzaMark(resto).trim()) ? " speciale" : ""}"><span class="em">${em}</span><span class="tx">${esc(senzaMark(resto))}</span></div>`);
        const fs = foto["sez:" + senzaMark(resto).trim()];
        if (fs) out.push(`<img class="fpart" src="${fs}" alt="" loading="lazy">`);
      } else {
        out.push(`<div class="rg"><span class="em">${em}</span><span>${inline(resto)}</span></div>`);
      }
      continue;
    }

    const mr = r.match(R);
    if (mr && chiaveSq(mr[1]) && chiaveSq(mr[4])){
      chiudiPara(); chiudiPremi();
      out.push(banda(mr[1], mr[4], mr[2], mr[3], mr[5], mr[6]));
      const fp = foto[chiaveSq(mr[1]) + "|" + chiaveSq(mr[4])];
      if (fp) out.push(`<img class="fpart" src="${fp}" alt="" loading="lazy">`);
      continue;
    }
    const mv = r.match(V);
    if (mv && chiaveSq(mv[1]) && chiaveSq(mv[2])){
      chiudiPara(); chiudiPremi();
      out.push(banda(mv[1], mv[2], null, null, null, null));
      continue;
    }
    if (!para.length && r.length < 52 && righe[n+1] && righe[n+1].trim()){
      chiudiPremi();
      out.push(`<h4 class="vet">${inline(r)}</h4>`);
      continue;
    }
    para.push(r);
  }
  chiudiPara(); chiudiPremi();
  return `<div class="art">${out.join("")}</div>`;
}

        <div class="t">${esc(u.editoriale.replica.titolo)}</div>
        ${u.editoriale.replica.testo.split("\n").filter(x => x.trim()).map(x => `<p>${inline(x)}</p>`).join("")}
        <div class="f">${esc(u.editoriale.replica.firma)}</div></details>` : ""}` : ""}

/* ---------- ingrandimento immagini ---------- */
let LBG = [], LBI = 0;
function copertina(u){
  if (!u.zone || !u.zone.length) return `<img class="cover" src="${u.cover}" alt="Copertina" style="margin:10px 0">`;
  return `<div class="covwrap"><img class="cover" src="${u.cover}" alt="Copertina">` +
    u.zone.map((z,i) => `<button class="zona" data-u="${u.num}" data-z="${i}" aria-label="Ingrandisci l'immagine" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%"></button>`).join("") +
    `</div><div class="covhint">🔍 Tocca le immagini per ingrandirle</div>`;
}
function lbApriZona(num, i){
  const u = LEGA.uscite.find(x => x.num === num); if (!u) return;
  const chiavi = [];
  u.zone.forEach(z => { if (chiavi.indexOf(z.k) < 0) chiavi.push(z.k); });
  const src = k => k === "copertina" ? (u.foto_copertina || u.cover) : (u.foto_partite || {})[k];
  LBG = chiavi.filter(k => src(k)).map(k => ({src: src(k), quadra: true}));
  LBI = Math.max(0, chiavi.filter(k => src(k)).indexOf(u.zone[i].k));
  lbApriLista();
}
function lbApriLista(){
  lbMostra(); $("lb").classList.add("on"); document.body.style.overflow = "hidden";
  history.pushState(Object.assign({}, history.state, {lb: 1}), "", location.hash);
}
function lbMostra(){
  const lb = $("lb"), im = lb.querySelector("img"), el = LBG[LBI];
  im.src = el.src;
  lb.classList.toggle("quadra", el.quadra);
  lb.querySelector(".pr").style.display = lb.querySelector(".nx").style.display = LBG.length > 1 ? "" : "none";
  lb.scrollTop = 0;
}
function lbApri(el){
  const box = el.closest(".card") || document;
  const els = el.classList.contains("cover") ? [el] : [...box.querySelectorAll(".fcop, .fpart")];
  LBI = Math.max(0, els.indexOf(el));
  LBG = els.map(x => ({src: x.src, quadra: !x.classList.contains("cover")}));
  lbApriLista();
}
function lbVai(d){ LBI = (LBI + d + LBG.length) % LBG.length; lbMostra(); }
function lbChiudi(daStoria){
  if (!$("lb").classList.contains("on")) return;
  if (!daStoria && history.state && history.state.lb){ history.back(); return; }
  $("lb").classList.remove("on"); document.body.style.overflow = "";
}
document.addEventListener("keydown", e => {
  if (!$("lb").classList.contains("on")) return;
  if (e.key === "Escape") lbChiudi();
  if (e.key === "ArrowLeft") lbVai(-1);
  if (e.key === "ArrowRight") lbVai(1);
});

/* ---------- navigazione ---------- */
const SEZIONI = [["prima","Prima pagina"],["archivio","Archivio"],["giornate","Giornate"],["classifica","Classifiche"],
                 ["statistiche","Statistiche"],["squadre","Squadre"],["mercato","Mercato"]];
let sezioneCorrente = "prima";

function esisteNumero(n){ return LEGA.uscite.some(u => u.num === n); }

function leggiHash(h){
  h = String(h || "").replace(/^#/, "").trim();
  if (!h) return {sez:"prima"};
  if (/^sfigometro$/i.test(h)) return {sez:"classifica", vai:"sfg-testa"};
  const m = h.match(/^n(\d+(?:[.,]\d+)?)(-pensieri|-speciale)?$/i);
  if (m){
    const num = parseFloat(m[1].replace(",", "."));
    const vai = m[2] ? (m[2].toLowerCase() === "-speciale" ? "speciale" : "edit") : null;
    return esisteNumero(num) ? {sez:"numero", num:num, vai:vai} : {sez:"prima", ripiego:true};
  }
  if (SEZIONI.some(([id]) => id === h)) return {sez:h};
  return {sez:"prima", ripiego:true};
}

function indirizzo(sez, num){ return sez === "numero" ? "#n" + num : "#" + sez; }

function mostra(sez, push, num){
  document.querySelectorAll("section").forEach(s => s.classList.remove("on"));
  const el = $("sec-" + sez);
  if (!el) return mostra("prima", push);
  el.classList.add("on");
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.sez === sez ? "true" : "false"));
  if (sez !== "numero") sezioneCorrente = sez;
  window.scrollTo(0, 0);
  if (push) history.pushState({sez:sez, num:(num === undefined ? null : num)}, "", indirizzo(sez, num));
}

function rendi(st){
  if (st.sez === "numero"){
    vistaNumero(st.num); mostra("numero", false, st.num);
    const el = st.vai && document.querySelector("#sec-numero ." + st.vai);
    if (el) setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"start"}), 900);
  }
  else {
    mostra(st.sez, false);
    const el = st.vai && document.querySelector("#sec-" + st.sez + " ." + st.vai);
    if (el) setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"start"}), 900);
  }
}

function init(){
  $("hLega").textContent = LEGA.nome;
  $("hAgg").textContent = "Aggiornato al " + LEGA.aggiornato;
  $("hSotto").textContent = "Stagione " + LEGA.stagione + " · archivio delle uscite";
  $("piede").textContent = "Archivio ufficiale della " + LEGA.nome + " · stagione " + LEGA.stagione;
  $("nav").innerHTML = SEZIONI.map(([id,t]) =>
    `<button data-sez="${id}"${id==="prima"?' aria-current="true"':""}>${t}</button>`).join("");
  vistaPrima(); vistaArchivio(); vistaClassifica(); vistaGiornate(); vistaStatistiche(); vistaSquadre(); vistaMercato();

  document.addEventListener("click", e => {
    const lb = $("lb");
    if (lb.classList.contains("on")){
      if (e.target.closest(".pr")) { lbVai(-1); return; }
      if (e.target.closest(".nx")) { lbVai(1); return; }
      if (e.target.tagName !== "IMG" || e.target.closest(".x") || e.target.closest(".tb")) { lbChiudi(); }
      return;
    }
    const zona = e.target.closest(".zona");
    if (zona){ lbApriZona(parseFloat(zona.dataset.u), +zona.dataset.z); return; }
    const zm = e.target.closest("#sec-numero .cover, #sec-numero .fpart, #sec-prima .cover");
    if (zm){ lbApri(zm); return; }
    const nav = e.target.closest("#nav button");
    if (nav){ mostra(nav.dataset.sez, true); return; }
    const apri = e.target.closest("[data-num]");
    if (apri){
      const num = parseFloat(apri.dataset.num);
      vistaNumero(num); mostra("numero", true, num);
      if (apri.dataset.vai){
        const el = document.querySelector("#sec-numero ." + apri.dataset.vai);
        if (el) setTimeout(() => el.scrollIntoView({behavior:"smooth", block:"start"}), 60);
      }
      return;
    }
    const rosa = e.target.closest("[data-rosa]");
    if (rosa){ $("rosa-" + rosa.dataset.rosa).classList.toggle("on"); return; }
    if (e.target.id === "indietro"){ history.back(); return; }
    if (e.target.id === "tema"){
      const scuro = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", scuro ? "light" : "dark");
      e.target.textContent = scuro ? "Tema scuro" : "Tema chiaro";
    }
  });

  window.addEventListener("popstate", ev => {
    if ($("lb").classList.contains("on")){ lbChiudi(true); return; }
    if (ev.state && ev.state.lb){ history.back(); return; }
    const st = (ev.state && ev.state.sez) ? {sez:ev.state.sez, num:ev.state.num} : leggiHash(location.hash);
    rendi(st);
  });

  window.addEventListener("hashchange", () => {
    const st = leggiHash(location.hash);
    if (st.ripiego){ history.replaceState({sez:"prima", num:null}, "", "#prima"); }
    rendi(st);
  });

  document.documentElement.setAttribute("data-theme", "light");

  const st = leggiHash(location.hash);
  if (st.sez === "numero"){
    sezioneCorrente = "archivio";
    history.replaceState({sez:"archivio", num:null}, "", "#archivio");
    history.pushState({sez:"numero", num:st.num}, "", "#n" + st.num + (st.vai === "edit" ? "-pensieri" : st.vai === "speciale" ? "-speciale" : ""));
    rendi(st);
  } else {
    history.replaceState({sez:st.sez, num:null}, "", "#" + st.sez);
    rendi(st);
  }
}
init();
